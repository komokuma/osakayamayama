<style>
/* 레이아웃: 화면 전체가 3D 무대. 닉네임 → 메인 → 대기실 → 보스방 순으로 그 위에 패널이 바뀐다 */
:root{

}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}   /* 연타해도 화면이 확대되지 않게 */
body{background:var(--sky);color:var(--paper);font-family:var(--display);overflow:hidden;position:relative;

canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud,.stage{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}
.upper{display:flex;flex-direction:column;gap:8px;text-shadow:0 1px 3px #000}
.bossbox{display:flex;flex-direction:column;gap:4px}
.bossname{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:1rem}
.bossname small{font-size:.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.track{height:14px;border:2px solid var(--paper);border-radius:999px;background:rgba(0,0,0,.45);overflow:hidden}
.track i{display:block;height:100%;transform-origin:left center;background:var(--hp)}
#bossHp{background:var(--boss)}
#castRow{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--gold);min-height:1.3em}
#castT{flex:1;height:9px;border-color:var(--gold)}
#castFill{background:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

#who{color:var(--gold);font-weight:400;margin-right:8px}
.hint{margin:0;font-size:.78rem;color:#b9d6d2}

.pad{display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:10px}

.btns{display:grid;grid-template-columns:auto auto;gap:10px;justify-items:end;align-items:end}

.sm{width:64px;height:64px;background:var(--paper);font-size:.86rem;box-shadow:0 5px 0 var(--ink-soft)}
.sm:active,.sm.on{transform:translateY(4px);box-shadow:0 1px 0 var(--ink-soft)}

/* 닉네임, 메인, 방 찾기, 결과: 가운데 패널 */
.veil{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,14,17,.55);overflow:auto;

.roomRow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:2px solid var(--paper);
  border-radius:14px;padding:9px 12px;color:var(--paper);font-size:1rem;cursor:pointer;text-align:left}
.roomRow small{color:var(--gold);white-space:nowrap}
/* 대기실: 위에 방 정보와 인원, 아래에 직업과 준비 */
.stage{gap:10px}
.box{pointer-events:auto;background:rgba(6,26,30,.8);border:2px solid var(--gold);border-radius:16px;padding:10px 12px;display:grid;gap:8px;

<script>
(function(){
if(!window.THREE){document.getElementById('fail').hidden=false;return;}
const T=THREE, canvas=document.getElementById('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById('fail').hidden=false;return;}
let PR=Math.min(window.devicePixelRatio||1,(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)?1.5:2);

/* ---------- 조명: 차가운 달빛, 부드러운 그림자, 청록빛 반사 ---------- */
const COARSE=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
scene.add(new T.HemisphereLight(0xa9bde0,0x3a2f40,0.48));
const sun=new T.DirectionalLight(0xbfd0ff,0.3); scene.add(sun); scene.add(sun.target);

  const es=new T.Scene();
  es.add(new T.Mesh(new T.SphereGeometry(20,24,16),new T.MeshBasicMaterial({color:0x0b3a3a,side:T.BackSide})));

// 그림자를 드리울 것과 받을 것을 정한다. 외곽선, 납작한 바닥, 꽃잎은 그림자를 드리우지 않는다
function shade(root){

    if(!m.isMesh)return;

function blob(rx,ry,rz,color,line){

const spring=()=>({x:0,v:0});
function step(s,target,k,d,dt){s.v+=(-k*(s.x-target)-d*s.v)*dt;s.x+=s.v*dt;}

const carG=new T.LatheGeometry([[0.03,0],[0.075,0.05],[0.11,0.3],[0.16,0.65],[0.2,0.92],[0.2,1.0],[0.16,1.08],[0.08,1.12],[0,1.13]].map(q=>new T.Vector2(q[0],q[1])),18);

/* ---------- 전장: 구름 소용돌이 아래 떠 있는 둥근 제단 ---------- */
const ARENA=21, BOSS_R=3.4, BODY=0.4, STEP=0.25, obstacles=[], turnips=[];
const hostile=()=>false; function stain(){} function hurt(){} let sawKill=false,sawing=false;
function floorAt(){return 0;}
function pushOut(P,y,rad){   // 보스 몸통을 뚫고 지나갈 수 없다
  if(gmode==='raid'&&boss.hp>0){const d=Math.hypot(P.x,P.z),m=BOSS_R+rad;if(d<m){if(d>0.01){P.x*=m/d;P.z*=m/d;}else P.z=m;}}

const FIRE_FS=`
uniform float t; uniform float s; varying vec2 vUv;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,v=0.;for(int i=0;i<4;i++){v+=a*n(p);p*=2.03;a*=.5;}return v;}
void main(){
  vec2 uv=vUv; uv.x+=sin(uv.y*6.+t*3.5+s)*.05*uv.y;                    // 살랑이는 흔들림
  float x=abs(uv.x-.5)*2.;
  float fl=fbm(vec2(uv.x*3.4+s,uv.y*2.4-t*2.2))*1.2+fbm(vec2(uv.x*8.+s*2.,uv.y*4.5-t*3.6))*.5;   // 위로 흘러 올라가는 무늬
  float w=.6*pow(1.-uv.y,.75)+.02;                                       // 아래는 넓고 위로 갈수록 가는 혀 모양
  float edge=x/w+(fl-.75)*1.1*(.25+uv.y);                                // 가장자리를 무늬로 들쭉날쭉하게 깎는다
  float body=1.-smoothstep(.5,1.1,edge);
  float f=clamp(body*(.5+fl*.7)-uv.y*.3,0.,1.)*smoothstep(0.,.07,uv.y);
  vec3 c=mix(vec3(.7,.06,.0),vec3(1.,.4,.02),smoothstep(.1,.4,f));
  c=mix(c,vec3(1.,.8,.22),smoothstep(.4,.72,f)); c=mix(c,vec3(1.,.97,.8),smoothstep(.8,1.,f));
  gl_FragColor=vec4(c*smoothstep(.05,.3,f)*.82,1.);
}`;

function mold(geo,grow,list){
  const P=geo.attributes.position, n=P.count, base=new Float32Array(n*3), wl=new Float32Array(n), wr=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=P.getX(i),y=P.getY(i),z=P.getZ(i);
    const w=Math.exp(-Math.pow((y+0.46)/0.34,2)), top=y>0?0.12*y:0;
    const dl=(x+0.6)*(x+0.6)+(y+0.42)*(y+0.42)+(z-0.62)*(z-0.62), dr=(x-0.6)*(x-0.6)+(y+0.42)*(y+0.42)+(z-0.62)*(z-0.62);
    const b=0.12*(Math.exp(-dl/0.16)+Math.exp(-dr/0.16));
    const X=x*0.6*(1+0.22*w-top)*(1+b), Y=y*(y<0?0.48:0.56)*(1+b*0.3), Z=z*0.55*((z>0?1+0.17*w:1+0.04*w)-top)*(1+b);
    base[i*3]=X*grow;base[i*3+1]=Y*grow;base[i*3+2]=Z*grow;
    wl[i]=Math.exp(-dl/0.3);wr[i]=Math.exp(-dr/0.3);
    P.setXYZ(i,base[i*3],base[i*3+1],base[i*3+2]);
  }
  list.push({P,base,wl,wr,n}); return geo;
}

const stick=$('stick'),knob=$('knob');
let sid=null;
function stickMove(e){
  const r=stick.getBoundingClientRect(),R=r.width/2;
  let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);const d=Math.hypot(dx,dy),m=R-14;
  if(d>m){dx*=m/d;dy*=m/d;}
  knob.style.transform='translate('+dx+'px,'+dy+'px)'; ix=dx/m; iy=dy/m;
}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;try{stick.setPointerCapture(sid);}catch(_){ }stickMove(e);e.preventDefault();});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)stickMove(e);});
function stickEnd(e){if(e.pointerId!==sid)return;sid=null;ix=iy=0;knob.style.transform='';}

let camYaw=0,camPitch=0.3,lookId=null,lx=0,ly=0,lookT=0;
canvas.addEventListener('pointerdown',e=>{if(lookId!==null)return;lookId=e.pointerId;lx=e.clientX;ly=e.clientY;try{canvas.setPointerCapture(lookId);}catch(_){ }});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerId!==lookId)return;
  lookT=2.5;camYaw-=(e.clientX-lx)*0.006;camPitch=Math.max(0.08,Math.min(1.25,camPitch+(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY;
});
const lookEnd=e=>{if(e.pointerId===lookId)lookId=null;};
canvas.addEventListener('pointerup',lookEnd);canvas.addEventListener('pointercancel',lookEnd);
let atkHeld=false,skillHeld=false,wantSkill=false,wantUlt=false,wantPotion=false;
{ // 공격과 보조 스킬은 누르고 있는 동안, 나머지는 한 번 누르기
  const hold=(id,set)=>{const b=$(id);
    b.addEventListener('pointerdown',e=>{set(true);try{b.setPointerCapture(e.pointerId);}catch(_){ }e.preventDefault();});
    ['pointerup','pointercancel'].forEach(t=>b.addEventListener(t,()=>set(false)));
    b.addEventListener('keydown',e=>{if(e.key==='Enter')set(true);});b.addEventListener('keyup',e=>{if(e.key==='Enter')set(false);});};
  hold('atk',v=>{atkHeld=v;});hold('skill',v=>{skillHeld=v;if(v)wantSkill=true;});
  const acts={jump:()=>{wantJump=true;},roll:()=>{wantRoll=true;},ult:()=>{wantUlt=true;},potion:()=>{wantPotion=true;}}, keyOf={' ':'jump',k:'roll',shift:'roll',i:'ult',h:'potion'};
  Object.keys(acts).forEach(id=>{
    const b=$(id);
    b.addEventListener('pointerdown',e=>{acts[id]();e.preventDefault();});
    b.addEventListener('keydown',e=>{if(e.key==='Enter')acts[id]();});
  });
  window.addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT')return;
    const k=e.key.toLowerCase();
    if(k==='j'){atkHeld=true;$('atk').classList.add('on');return;}
    if(k==='l'){if(!e.repeat)wantSkill=true;skillHeld=true;$('skill').classList.add('on');return;}
    if(keyOf[k]){if(!e.repeat)acts[keyOf[k]]();$(keyOf[k]).classList.add('on');if(k===' ')e.preventDefault();return;}
    if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){keys[k]=true;e.preventDefault();}
  });
  window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;
    if(k==='j'){atkHeld=false;$('atk').classList.remove('on');}if(k==='l'){skillHeld=false;$('skill').classList.remove('on');}
    if(keyOf[k])$(keyOf[k]).classList.remove('on');});
}

function tone(f0,dur,type,vol,f1,dest,when){

  const t=when||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.03);
}
function noise(dur,vol,f0,f1,dest,when){
  if(!AC)return;

  n.buffer=noiseBuf;bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(f0,t);if(f1)bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(bp);bp.connect(g);g.connect(dest||master);n.start(t);n.stop(t+dur+0.03);
}

const TUNE=[69,72,76,72,81,76,72,76, 65,69,72,69,77,72,69,72, 67,71,74,71,79,74,71,74, 64,68,71,68,76,71,68,64,

function musicTick(){
  if(!AC)return;
  if(nextNote<AC.currentTime-0.1)nextNote=AC.currentTime+0.05;
  while(nextNote<AC.currentTime+0.25){
    const i=noteI%TUNE.length,m=TUNE[i],t=nextNote;
    if(m)tone(hz(m),0.2,'triangle',0.2,0,musicG,t);
    if(i%4===0)tone(hz(BASS[(i>>3)%4]+(i%8?12:0)),0.3,'sine',0.26,0,musicG,t);

}

const SPEED=4.6, ROLL_T=0.42, ROLL_SP=9.5, REST_X=0.3, REST_Z=-0.45;
const COST={jump:16,roll:24,hit:0,dash:30}, DASH_T=0.32, DASH_SP=14, DASH_DMG=15;
let time=0,kos=0,popT=0,popB=null;
function spend(b,c){if(b.sta<c){b.noSta=0.35;if(!b.quiet)sfx('no');return false;}b.sta-=c;if(c>0)b.rest=0;return true;}
function boing(b,k){
  b.ears.forEach(e=>{e.a.v+=5*k*(1+e.side*0.2);e.b.v+=9*k;e.z.v+=3*k;});
  b.cheeks.forEach(c=>{c.s.v-=1.1*k;});
}
function pop(text,b){if(text==='회피!')sfx('dodge');popEl.textContent=text;popT=0.7;popB=b;}
function springs(b,k,dt){
  b.ears.forEach(e=>{
    step(e.a,-0.3*k-(b.air?b.jv*0.05:0),120,4.5,dt); step(e.b,0,90,4,dt); step(e.z,0,110,5,dt);
    e.p.rotation.x=-0.08+e.a.x; e.p.rotation.z=-e.side*(0.07+e.z.x*0.5);
    const st=Math.max(-0.22,Math.min(0.28,e.b.x*0.25));
    e.p.scale.set(1-st*0.5,1+st,1-st*0.5);
  });
  b.cheeks.forEach(c=>step(c.s,0,c.k,4.2,dt));
  const lim=v=>Math.max(-0.12,Math.min(0.12,v)), oL=lim(b.cheeks[0].s.x), oR=lim(b.cheeks[1].s.x);
  // 볼살이 거의 멈췄거나 멀리 있으면 꼭짓점 계산을 건너뛴다
  const calm=b.lod>0||Math.abs(oL)+Math.abs(oR)<0.004;
  if(calm&&b.still)return;
  b.still=calm;
  const qL=calm?0:oL,qR=calm?0:oR;
  b.soft.forEach(m=>{
    for(let i=0;i<m.n;i++){
      const d=m.wl[i]*qL+m.wr[i]*qR, a=m.wl[i]*Math.abs(qL)+m.wr[i]*Math.abs(qR);
      m.P.setXYZ(i,m.base[i*3]*(1+a*0.6),m.base[i*3+1]+d,m.base[i*3+2]*(1+a*0.4));
    }
    m.P.needsUpdate=true;
  });
}

function updateBunny(b,c,dt){
  const R=b.root.position;
  if(b.hurt>0){b.hurt-=dt;b.fur.color.setHex(b.hurt>0?b.o.hurt:b.o.fur);}
  if(b.noSta>0)b.noSta-=dt;
  b.rest+=dt; if(b.rest>0.7)b.sta=Math.min(100,b.sta+26*dt);
  b.fan.visible=false;

  if(b.dead>0){ // 쓰러짐
    b.dead-=dt;b.dt+=dt;
    const u=Math.min(1,b.dt/0.3);
    b.spin.rotation.set(0,0,u*Math.PI/2);b.spin.position.y=PIV-u*0.3;
    R.x+=b.kx*dt;R.z+=b.kz*dt;const f=Math.exp(-6*dt);b.kx*=f;b.kz*=f;
    pushOut(R,b.jy,BODY);
    const df=floorAt(R.x,R.z,b.jy);
    if(b.jy>df){b.jv-=19*dt;b.jy=Math.max(df,b.jy+b.jv*dt);}
    R.y=b.jy;b.shadow.position.y=df+0.02;
    springs(b,0,dt);
    b.shadow.position.x=R.x;b.shadow.position.z=R.z;
    if(b.jy<0.1&&Math.random()<dt*5)stain(R.x+(Math.random()-0.5)*0.9,R.z+(Math.random()-0.5)*0.9,0.2+Math.random()*0.25);   // 피 웅덩이가 번진다
    if(b.dead<=0){if(b===player)respawn(b);else b.gone=true;}
    return;
  }

  if(b.ride)c={mx:c.mx,mz:c.mz,jump:c.jump};   // 타고 있을 때는 운전과 점프만
  let mx=c.mx||0,mz=c.mz||0; const ml=Math.hypot(mx,mz); if(ml>1){mx/=ml;mz/=ml;}
  if(b.ai&&b.swing>=0){mx=0;mz=0;}

  // 구르기: 시작부터 끝까지 무적
  if(c.roll&&b.roll<0&&!b.air&&spend(b,COST.roll)){
    b.roll=0;b.swing=-1;b.dash=-1;
    if(ml>0.2){b.rdx=mx/Math.min(1,ml);b.rdz=mz/Math.min(1,ml);const l=Math.hypot(b.rdx,b.rdz);b.rdx/=l;b.rdz/=l;}
    else{b.rdx=Math.sin(b.face);b.rdz=Math.cos(b.face);}
    b.face=Math.atan2(b.rdx,b.rdz);boing(b,1.2);sfx('roll',b.quiet);
  }
  if(b.roll>=0){
    b.roll+=dt;const u=b.roll/ROLL_T,s=ROLL_SP*(1-0.45*u);
    b.vx=b.rdx*s;b.vz=b.rdz*s;
    if(u>=1){b.roll=-1;b.vx*=0.4;b.vz*=0.4;boing(b,1.3);b.land=0.12;}
  }
  // 돌진: 보고 있는 방향으로 곧게 튀어 나가며 부딪힌 상대를 날려 보낸다
  if(c.dash&&b.dash<0&&b.roll<0&&spend(b,COST.dash)){
    b.dash=0;b.swing=-1;b.ddx=Math.sin(b.face);b.ddz=Math.cos(b.face);b.dashHit=[];boing(b,-1.5);sfx('dash',b.quiet);
  }
  if(b.roll>=0){}
  else if(b.dash>=0){
    b.dash+=dt;const u=b.dash/DASH_T,s=DASH_SP*(1-0.3*u);
    b.vx=b.ddx*s;b.vz=b.ddz*s;
    bunnies.forEach(o=>{
      if(o===b||o.dead>0||!hostile(b,o)||b.dashHit.includes(o))return;
      const dx=o.root.position.x-R.x,dz=o.root.position.z-R.z;
      if(Math.hypot(dx,dz)>1.1||Math.abs(o.jy-b.jy)>1.0)return;
      b.dashHit.push(o);
      if(o.roll>=0){pop('회피!',o);return;}
      sawKill=b===player&&sawing;hurt(o,b,{dx:b.ddx,dz:b.ddz},DASH_DMG);sawKill=false;o.kx=b.ddx*11;o.kz=b.ddz*11;
    });
    if(!b.enemy&&b.jy<1.0)turnips.forEach(t=>{
      const dx=t.g.position.x-R.x,dz=t.g.position.z-R.z;
      if(Math.hypot(dx,dz)<1.0&&!b.dashHit.includes(t)){b.dashHit.push(t);t.s.v+=12;t.vx=b.ddx*8;t.vz=b.ddz*8;t.axis.set(b.ddz,0,-b.ddx);}
    });
    if(u>=1){b.dash=-1;b.vx*=0.3;b.vz*=0.3;boing(b,1.5);}
  }else if(b.ride){   // 오토바이: 스틱 방향으로 서서히 꺾으며 달린다
    const bk=b.ride;
    if(ml>0.15){
      let d=Math.atan2(mx,mz)-bk.face;d=Math.atan2(Math.sin(d),Math.cos(d));
      const t=Math.max(-3.4*dt,Math.min(3.4*dt,d));
      bk.face+=t;bk.turn+=(t/dt-bk.turn)*0.2;
      bk.sp+=(Math.min(1,ml)*BIKE_SP*(Math.abs(d)>2?0.4:1)-bk.sp)*(1-Math.exp(-2.2*dt));
    }else{bk.sp*=Math.exp(-1.6*dt);bk.turn*=0.85;}
    if(b.blocked)bk.sp*=0.6;
    b.vx=Math.sin(bk.face)*bk.sp;b.vz=Math.cos(bk.face)*bk.sp;b.face=bk.face;
  }else{
    const ease=1-Math.exp(-10*dt);
    b.vx+=(mx*b.speed-b.vx)*ease;b.vz+=(mz*b.speed-b.vz)*ease;
  }
  const sp=Math.hypot(b.vx,b.vz),k=Math.min(1,sp/SPEED);
  R.x+=(b.vx+b.kx)*dt;R.z+=(b.vz+b.kz)*dt;
  const kf=Math.exp(-7*dt);b.kx*=kf;b.kz*=kf;
  const pr=Math.hypot(R.x,R.z); if(pr>ARENA){R.x*=ARENA/pr;R.z*=ARENA/pr;}
  const blk=pushOut(R,b.jy,BODY); b.blocked=blk?blk.h:0;
  if(b.roll<0&&b.dash<0&&!b.ride){
    let tg=null; if(c.aim!==undefined)tg=c.aim; else if(sp>0.3)tg=Math.atan2(b.vx,b.vz);
    if(tg!==null){let d=tg-b.face;d=Math.atan2(Math.sin(d),Math.cos(d));b.face+=d*(1-Math.exp(-14*dt));}
  }
  b.root.rotation.y=b.face;

  // 깡총깡총
  const rolling=b.roll>=0, dashing=b.dash>=0||!!b.ride;
  if(!rolling&&!dashing)b.phase+=sp*dt*2.5;
  const beat=Math.floor(b.phase/Math.PI);
  if(beat!==b.lastBeat){b.lastBeat=beat;if(k>0.2&&!b.air){boing(b,k);if(b===player||Math.hypot(R.x-player.root.position.x,R.z-player.root.position.z)<7)sfx('step',b.quiet);}}
  const hop=(rolling||dashing)?0:Math.abs(Math.sin(b.phase))*k, breathe=Math.sin(time*2.4+(b.enemy?1:0))*0.015;

  // 점프
  const fl=floorAt(R.x,R.z,b.jy);
  if(c.jump&&!b.air&&!rolling&&spend(b,COST.jump)){b.air=true;b.jv=7.2;boing(b,-0.8);sfx('jump',b.quiet);}
  if(!b.air&&b.jy>fl+0.02){b.air=true;b.jv=0;}   // 가장자리에서 걸어 나가면 떨어진다
  if(b.air){
    b.jv-=19*dt;b.jy+=b.jv*dt;
    if(b.jv<=0&&b.jy<=fl){b.jy=fl;b.air=false;boing(b,1.6+Math.min(1,-b.jv/8));b.land=0.22;b.jv=0;sfx('land',b.quiet);}
  }else b.jy=fl;
  if(b.land>0)b.land-=dt;
  R.y=b.jy;
  const hopG=b.air?0:hop;
  b.bod.position.y=-PIV+hopG*0.24+(b.ride?SEAT:0);
  const sq=1+(hopG-0.45*k)*0.16+breathe+(b.air?Math.max(-0.1,Math.min(0.22,b.jv*0.03)):0)-Math.max(0,b.land)*1.3;
  b.bod.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  if(rolling){b.spin.rotation.set(b.roll/ROLL_T*Math.PI*2,0,0);b.spin.scale.setScalar(0.86);b.spin.position.y=PIV*0.86-0.04;}
  else{b.spin.rotation.set(0,0,b.ride?-b.ride.turn*0.1:0);b.spin.scale.setScalar(1);b.spin.position.y=PIV;}
  b.feet.forEach((f,i)=>{
    const s=Math.sin(b.phase+(i?Math.PI:0));
    f.position.y=0.12+Math.max(0,s)*0.1*k;f.position.z=0.06+Math.cos(b.phase+(i?Math.PI:0))*0.14*k;
  });
  b.shadow.position.x=R.x;b.shadow.position.z=R.z;b.shadow.position.y=fl+0.02;b.shadow.scale.setScalar(b.sc*Math.max(0.45,1-hopG*0.3-(b.jy-fl)*0.28));

  // 당근 휘두르기
  if(c.hit&&b.swing<0&&!rolling&&!dashing&&spend(b,COST.hit)){b.swing=0;b.hitDone=false;boing(b,0.9);}
  let ax=REST_X+Math.sin(b.phase)*0.35*k,lean=0.12*k;
  if(b.swing>=0){
    b.swing+=dt;const t=b.swing,W=b.wind;
    if(t<W){ax=REST_X+(-1.2-REST_X)*(t/W);lean=-0.12*(t/W);}
    else if(t<W+0.1){const u=(t-W)/0.1;ax=-1.2+3.3*u*u;lean=0.35*u;}
    else if(t<W+0.31){const u=(t-W-0.1)/0.21;ax=2.1+(REST_X-2.1)*u*u*(3-2*u);lean=0.35*(1-u);}
    else b.swing=-1;
    if(b.enemy&&t<W){b.fan.visible=true;b.fanMat.opacity=0.22*(t/W);}  // 까만토끼는 때리기 전에 범위를 미리 보여준다
    if(!b.hitDone&&t>=W+0.07){b.hitDone=true;strike(b);boing(b,0.7);}
  }
  if(b.fanT>0){b.fanT-=dt;b.fan.visible=true;b.fanMat.opacity=0.42*Math.max(0,b.fanT)/0.25;}
  if(b.fan.visible){b.fan.position.set(R.x,b.jy+0.03,R.z);b.fan.rotation.y=b.face;}
  if(dashing){ax=1.5;lean=0.55;}
  if(b.ride){ax=1.25;lean=0.18;}
  if(b.sawT>0){b.sawT-=dt;if(b.swing<0&&b.dash<0&&!b.ride){ax=1.42;lean=0.22;}ax+=Math.sin(time*95)*0.07;}   // 전기톱을 앞으로 내밀고 부르르
  if(b.shootT>0){b.shootT-=dt;ax=1.5+Math.sin(time*60)*0.06;}   // 당근을 앞으로 겨누고 덜덜덜   // 당근을 앞으로 내밀고 몸을 숙인다
  b.arm.rotation.set(ax,0,(dashing||b.sawT>0)?-0.1:REST_Z);
  b.armL.position.z=0.12-Math.sin(b.phase)*0.12*k;
  b.bod.rotation.x=lean;

  b.twitch-=dt; if(b.twitch<0){b.twitch=1.8+Math.random()*2;if(k<0.2){const e=b.ears[Math.random()<0.5?0:1];e.a.v+=3.5;e.b.v+=5;}}
  if(b.ride){
    const bk=b.ride;
    bk.g.position.set(R.x,b.jy,R.z);bk.g.rotation.set(0,bk.face,-bk.turn*0.1);
    bk.wheels.forEach(w=>{w.rotation.x+=bk.sp*dt/0.36;});
    if(bk.gore>0){bk.gore-=dt;if(b.jy<0.1&&bk.sp>2&&Math.random()<dt*22)stain(R.x-Math.sin(bk.face)*0.6,R.z-Math.cos(bk.face)*0.6,0.13);}   // 피 묻은 바퀴 자국
    bk.put-=dt; if(bk.sp>1&&bk.put<0){bk.put=0.07+(1-bk.sp/BIKE_SP)*0.09;tone(60+bk.sp*7,0.06,'sawtooth',0.035);}   // 부릉부릉
  }
  springs(b,b.ride?b.ride.sp/BIKE_SP*2.2:(dashing?2.4:k),dt);
}

  const now=time,weak=kind==='hit';

  const b=h.b,g=h.gear,arm=b.arm,L=b.armL,k=h.cls,bod=b.bod,a=h.act,fight=state==='fight'&&b.dead<=0;
  let tw=0,side=0,ln=0,up=0,step=0;
  arm.position.set(0.46,0.52,0.12);L.position.x=-0.46;L.position.y=0.52;
  // 그래플러는 싸울 때 두 주먹을 올린 자세로 선다
  if(k==='grp'&&fight){arm.position.set(0.34,0.74,0.4);arm.rotation.set(1.5,0,-0.1);L.position.set(-0.34,0.74,0.4);up=Math.sin(time*9)*0.02;}
  g.potion.visible=h.drink>0;
  if(h.drink>0)L.position.set(-0.2,1.0,0.5);
  if(a&&k!=='grp'){
    const mv=a.name?CTR_MOVE:BODY_MOVE[k][a.step],u=a.t/a.dur,w=a.at*0.7,e=a.at+0.12;let x,z;
    if(u<w){const q=ease(u/w);x=mix(REST_X,a.from[0],q);z=mix(REST_Z,a.from[1],q);tw=mv.tw[0]*q;ln=mv.ln[0]*q;up=mv.up[0]*q;side=mv.side[0]*q;step=-0.08*q;}        // 당기기
    else if(u<e){const q=Math.min(1,(u-w)/(e-w)),p=q*q;x=mix(a.from[0],a.to[0],p);z=mix(a.from[1],a.to[1],p);tw=mix(mv.tw[0],mv.tw[1],p);ln=mix(mv.ln[0],mv.ln[1],p);up=mix(mv.up[0],mv.up[1],p);side=mix(mv.side[0],mv.side[1],p);step=mix(-0.08,mv.step,p);}   // 휘두르기
    else{const q=ease((u-e)/(1-e));x=mix(a.to[0],REST_X,q);z=mix(a.to[1],REST_Z,q);tw=mv.tw[1]*(1-q);ln=mv.ln[1]*(1-q);up=mv.up[1]*(1-q);side=mv.side[1]*(1-q);step=mv.step*(1-q);}   // 되돌리기
    arm.rotation.set(x,0,z);
    if(k==='ham'){L.position.set(0.05,0.5+up*0.3,0.42);}                 // 해머는 두 손으로 쥔다
    else{L.position.x=-0.5-tw*0.12;L.position.z=0.12-tw*0.25;}           // 반대 손이 균형을 잡는다
  }else if(a){   // 그래플러: 1~5 좌우 잽, 6~7 훅, 8~9 올려치기, 10 두 주먹 지르기
    const u=Math.min(1,a.t/a.dur),e=Math.sin(u*Math.PI),s=a.step,right=s%2===0,sg=right?-1:1;
    if(a.last){const q=u<0.4?ease(u/0.4):1,p=u<0.4?0:Math.sin((u-0.4)/0.6*Math.PI);
      tw=0.9*q*(1-p)-0.2*p;ln=-0.15*q+0.75*p;step=-0.15*q+0.95*p;up=0.1*q+0.12*p;
      arm.position.set(0.3,0.7+0.05*p,0.3+1.0*p);L.position.set(-0.3,0.7+0.05*p,0.3+1.0*p);}
    else if(s>=7){up=-0.2*(1-e)*((u<0.5)?1:0)+0.42*e;ln=0.3-0.55*e;tw=sg*0.5*e;step=0.2*e;
      const hand=right?arm:L;hand.position.set((right?1:-1)*0.26,0.5+e*0.95,0.45+e*0.25);}
    else if(s>=5){tw=sg*1.05*e;ln=0.22;step=0.28*e;side=-sg*0.2*e;
      const hand=right?arm:L;hand.position.set((right?1:-1)*(0.5-e*0.55),0.78,0.45+e*0.55);}
    else{tw=sg*0.6*e;ln=0.24+0.12*e;step=0.26*e;up=-0.04*e;
      const hand=right?arm:L;hand.position.set((right?1:-1)*(0.34-e*0.2),0.76,0.4+e*0.85);}
    arm.rotation.set(1.5,0,-0.1);
  }
  if(h.fly){arm.rotation.set(1.6,0,-0.1);ln=0.75;step=0.5;if(k==='ham')L.position.set(0.05,0.55,0.45);}
  if(h.plunge){arm.rotation.set(-1.7,0,0);ln=-0.3;if(k==='ham')L.position.set(0.05,0.9,0.1);}
  if(h.blink){ln=0.6;step=0.4;}
  if(h.shieldUp){tw=-0.35;ln=0.12;step=0.1;}
  // 몸통에 적용 (걷기 동작이 정한 숙임과 높이에 더한다)
  const sm=Math.min(1,dt*30);
  bod.rotation.y+=(tw-bod.rotation.y)*sm;bod.rotation.z+=(side-bod.rotation.z)*sm;bod.rotation.x+=ln;
  bod.position.z+=(step-bod.position.z)*sm;bod.position.y+=up;
  // 방패
  const sh=h.shieldUp;g.shield.position.lerp(v3.set(sh?0.1:-0.62,sh?0.62:0.56,sh?0.66:0.22),Math.min(1,dt*18));g.shield.scale.setScalar(sh?1.5:1);
  // 필살기 겉모습
  const big=k==='ham'&&h.ultT>0?3:1;g.hammer.scale.setScalar(g.hammer.scale.x+(big-g.hammer.scale.x)*Math.min(1,dt*6));
  const fire=k==='grp'&&h.ultT>0;g.fR.visible=g.fL.visible=fire;
  if(fire){const s=0.8+Math.sin(time*30)*0.15;g.fR.scale.setScalar(s);g.fL.scale.setScalar(s/0.13);}
  const A=auras[h.idx];A.visible=k==='grd'&&h.ultT>0&&b.dead<=0;if(A.visible){A.position.set(b.root.position.x,0.06,b.root.position.z);A.rotation.y+=dt;}
}

/* ---------- 보스의 기술 ---------- */
const SCRIPT=[null,
  ['slam','slam','shock','heavy','slam','crystal','slam','shock'],
  ['slam','stack','shock','heavy','spread','slam','crystal','stack+shock','heavy'],
  ['ult','slam','stack+shock','heavy','spread+slam','slam','crystal','shock+heavy']];
const GAP=[0,2.4,2.0,1.5], SLAM_T=[0,1.4,1.25,1.1];
const NAMES={slam:'내려찍기',heavy:'대지 가르기 (피하거나 패링)',shock:'충격파 (점프)',crystal:'공명 수정 (셋을 함께 부수기)',stack:'별똥별 (모이기)',spread:'별가루 폭발 (흩어지기)',ult:'종말의 빛 (보호막 부수기)'};
const cryst={on:false,t:0,win:0};
function pickTarget(){
  const a=alive(); if(!a.length)return null;
  return a.reduce((x,y)=>y.threat>x.threat?y:x);
}
function addRing(){const m=new T.Mesh(new T.TorusGeometry(1,0.035,6,72),glow(0xfff06a));m.rotation.x=Math.PI/2;m.position.y=0.25;scene.add(m);rings.push({m,r:BOSS_R,done:[]});sfx('dash',true);}
function startMove(kind,quiet){
  const en=boss.clock>420?3:1, P3=boss.phase;
  if(kind==='slam'||kind==='heavy'){
    const tg=pickTarget(); if(!tg)return 0;
    const hv=kind==='heavy',R=tg.b.root.position,dur=hv?1.9:SLAM_T[P3];
    tele({x:R.x,z:R.z,r:hv?3.8:3.2,dur,color:hv?0xff2f4f:0xff8a3c,kind:'avoid',tank:tg,hit:t=>{
      heroes.forEach(h=>{if(dist(h.b.root.position,t)<t.r+0.3)hitHero(h,(hv?105:40)*en,t.x,t.z);});sfx('land');smp('rubble',hv?0.8:0.45,rr());if(hv)smp('boom',0.7,0.7);burst(t.x,0.4,t.z,hv?18:10,0xd8c8a8,7,0.5);shake=Math.max(shake,hv?0.4:0.18);boss.fist^=1;}});
    return dur;
  }
  if(kind==='shock'){boss.ringT=1.2;return 1.2;}
  if(kind==='stack'){
    const a=alive(),tg=a[Math.floor(Math.random()*a.length)]; if(!tg)return 0;
    tele({x:0,z:0,r:3.5,dur:4.6,color:0x4aa8ff,kind:'stack',follow:tg,hit:t=>{
      const inR=alive().filter(h=>dist(h.b.root.position,t)<t.r+0.2);
      inR.forEach(h=>hitHero(h,126/inR.length,t.x+0.01,t.z,true));sfx('land');}});
    if(tg===me)toast('나에게 별똥별! 모여요');
    return 4.6;
  }
  if(kind==='spread'){
    alive().forEach(tg=>tele({x:0,z:0,r:3.2,dur:3.8,color:0xc77dff,kind:'spread',follow:tg,hit:t=>{
      alive().forEach(h=>{if(h!==t.follow&&dist(h.b.root.position,t)<t.r)hitHero(h,40,t.x+0.01,t.z,true);});}}));   // 남의 원에 겹치면 맞는다
    return 3.8;
  }
  if(kind==='crystal'){
    const a0=Math.random()*6.28;
    for(let i=0;i<3;i++){
      const a=a0+i*2.0944,x=Math.cos(a)*14,z=Math.sin(a)*14,g=new T.Group();
      const m=new T.Mesh(new T.OctahedronGeometry(0.9),new T.MeshStandardMaterial({color:0x35e0c8,roughness:0.12,emissive:0x1a9a88,envMapIntensity:1.3}));m.scale.y=1.7;m.position.y=1.7;g.add(m);
      const base=new T.Mesh(CIRC,tmat(0x4be3c8,0.3));base.rotation.x=-Math.PI/2;base.scale.setScalar(1.6);base.position.y=0.04;g.add(base);
      g.position.set(x,0,z);scene.add(g);crystals.push({g,m,x,z,hp:100,alive:true,flash:0});
    }
    cryst.on=true;cryst.t=0;cryst.win=0;
    // 동료는 가까운 수정을 하나씩 맡고, 남은 하나는 내 몫
    const free=crystals.slice();
    heroes.forEach(h=>{h.claim=null;if((h!==me||AUTO)&&h.b.dead<=0){const R=h.b.root.position;free.sort((p,q)=>dist(p,R)-dist(q,R));h.claim=free.shift();}});
    return 17;
  }
  if(kind==='ult'){boss.shield=1050;return 14;}
  return 0;
}
function endCrystals(ok){
  if(!cryst.on)return;
  cryst.on=false;clearList(crystals);heroes.forEach(h=>{h.claim=null;});
  if(boss.cast&&boss.cast.kind==='crystal')boss.cast=null,boss.gcd=GAP[boss.phase];
  if(ok===true){toast('공명 파괴! 거신이 흔들려요');boss.stun=3;sfx('win');}
  else if(ok===false&&boss.hp>0){toast('수정 폭발!');heroes.forEach(h=>hitHero(h,85,0,0,true));}
}
function bossTick(dt){
  const g=boss.g;
  if(boss.flash>0)boss.flash-=dt;
  core.material.color.setHex(boss.flash>0?0xffffff:boss.stun>0?0x2a6b63:0x5dffe0);
  // 맞으면 번쩍하고, 밀리며 움찔했다가 제자리로 돌아온다
  if(boss.wf>0)boss.wf-=dt;const fl=Math.min(0.32,Math.max(0,boss.wf)*4);boss.mats.forEach(m=>m.emissive.setScalar(fl));   // 내 타격에만 번쩍인다
  if(boss.hp>0){const kd=Math.exp(-13*dt);boss.kx*=kd;boss.kz*=kd;boss.sq*=Math.exp(-10*dt);g.position.x=boss.kx;g.position.z=boss.kz;g.scale.set(1+boss.sq*0.6,1-boss.sq,1+boss.sq*0.6);}
  if(boss.hp<=0){g.rotation.x=Math.min(1.2,g.rotation.x+dt*0.8);g.position.y=Math.max(-3,g.position.y-dt*1.5);return;}
  boss.clock+=dt;
  heroes.forEach(h=>{h.threat*=Math.exp(-0.06*dt);});
  if(boss.burn>0){boss.burn-=dt;if(boss.burnBy)damageBoss(28*dt,boss.burnBy);}   // 화상: 지속 피해
  // 시선: 지금 노리는 토끼를 바라본다
  const tg=pickTarget();
  if(tg&&boss.stun<=0){let d=Math.atan2(tg.b.root.position.x,tg.b.root.position.z)-g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));g.rotation.y+=d*(1-Math.exp(-3*dt));}
  // 주먹과 몸짓
  const c=boss.cast,u=c?c.t/c.dur:0;
  fists.forEach((f,i)=>{
    const b=f.userData.base;let y=b[1]+Math.sin(time*1.6+i*2)*0.25,z=b[2];
    if(c&&(c.kind==='slam'||c.kind==='heavy')&&i===boss.fist){y=b[1]+(u<0.8?u/0.8*4.5:4.5-(u-0.8)/0.2*7);z=b[2]+u*2.5;}
    if(c&&c.kind==='ult')y=b[1]+3+Math.sin(time*10)*0.15;
    if(boss.ringT>0)y=b[1]+(boss.ringT>0.25?(1.2-boss.ringT)*4:-1.5);
    if(boss.stun>0)y=1.3;
    f.position.y+=(y-f.position.y)*Math.min(1,dt*14);f.position.z+=(z-f.position.z)*Math.min(1,dt*10);
  });
  g.rotation.x+=((boss.stun>0?0.28:0)-g.rotation.x)*Math.min(1,dt*5);
  core.scale.setScalar(c&&c.kind==='ult'?0.85+u*1.1+Math.sin(time*18)*0.06:0.85);
  if(boss.stun>0){boss.stun-=dt;return;}
  if(boss.ringT>0){boss.ringT-=dt;if(boss.ringT<=0)addRing();}
  // 페이즈
  const ph=boss.hp>boss.hpMax*0.7?1:boss.hp>boss.hpMax*0.35?2:3;
  if(ph!==boss.phase){boss.phase=ph;boss.si=0;toast(ph+'페이즈');sfx('alarm');if(!boss.cast)boss.gcd=1.5;}
  if(c){
    c.t+=dt;
    if((c.kind==='crystal'||c.kind==='ult')&&boss.phase>=2){c.rt=(c.rt||3)-dt;if(c.rt<=0){c.rt=c.kind==='ult'?4:5.5;boss.ringT=1.0;}}
    if(c.kind==='ult'&&boss.shield<=0){boss.cast=null;boss.stun=6.5;boss.gcd=1;toast('보호막 파괴! 지금이야!');sfx('win');return;}
    if(c.t>=c.dur){
      if(c.kind==='ult'){toast('종말의 빛');heroes.forEach(h=>hitHero(h,9999,0,0,true));}
      if(c.kind==='crystal')endCrystals(false);
      boss.cast=null;boss.gcd=GAP[boss.phase];
    }
  }else{
    boss.gcd-=dt;
    if(boss.gcd<=0&&alive().length){
      const list=SCRIPT[boss.phase],parts=list[boss.si%list.length].split('+');boss.si++;
      const dur=startMove(parts[0]);
      if(parts[1])startMove(parts[1]);
      if(dur>0)boss.cast={kind:parts[0],t:0,dur};else boss.gcd=1;
    }
  }
}
function fxTick(dt){
  // 예고 범위
  for(let i=teles.length-1;i>=0;i--){
    const t=teles[i];t.t+=dt;
    if(t.follow){if(t.follow.b.dead>0&&t.kind==='spread'){scene.remove(t.g);teles.splice(i,1);continue;}t.x=t.follow.b.root.position.x;t.z=t.follow.b.root.position.z;t.g.position.x=t.x;t.g.position.z=t.z;}
    const u=Math.min(1,t.t/t.dur);t.grow.scale.setScalar(u);
    if(t.t>=t.dur){scene.remove(t.g);teles.splice(i,1);t.hit(t);}
  }
  // 충격파: 지나가는 순간 땅에 서 있으면 맞는다
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i],r0=r.r;r.r+=9.5*dt;r.m.scale.set(r.r,r.r,6);
    heroes.forEach(h=>{const d=Math.hypot(h.b.root.position.x,h.b.root.position.z);
      if(d>=r0&&d<r.r&&!r.done.includes(h)){r.done.push(h);if(h.b.jy<0.45)hitHero(h,24,0,0);}});
    if(r.r>ARENA+3){scene.remove(r.m);rings.splice(i,1);}
  }
  // 공명 수정: 첫 수정이 깨진 뒤 4초 안에 나머지도 깨야 한다
  if(cryst.on){
    cryst.t+=dt;
    crystals.forEach(c=>{if(c.flash>0)c.flash-=dt;c.m.material.emissive.setHex(c.flash>0?0xffffff:0x1a9a88);c.m.rotation.y+=dt*1.5;c.m.scale.set(0.6+0.4*c.hp/100,1.7*(0.6+0.4*c.hp/100),0.6+0.4*c.hp/100);});
    if(crystals.every(c=>!c.alive))endCrystals(true);
    else if(cryst.win>0){cryst.win-=dt;if(cryst.win<=0){crystals.forEach(c=>{c.alive=true;c.hp=100;c.g.visible=true;});toast('공명 실패! 수정이 되살아났어요');}}
  }
  // 꾸밈용 충격 고리
  for(let i=puffs.length-1;i>=0;i--){const p=puffs[i];p.r+=(p.max*4+4)*dt;p.m.scale.set(p.r,p.r,3);p.m.material.opacity=Math.max(0,0.9*(1-p.r/p.max));if(p.r>=p.max){scene.remove(p.m);puffs.splice(i,1);}}
  // 부활: 쓰러진 동료 곁에 붙어 있으면 일어난다
  heroes.forEach(d=>{
    if(d.b.dead<=0)return;
    let rate=0;alive().forEach(h=>{if(dist(h.b.root.position,d.b.root.position)<1.9)rate=1;});
    d.rev=rate?d.rev+rate*dt:Math.max(0,d.rev-dt);
    if(d.rev>=3){d.rev=0;d.b.dead=0;d.b.hp=d.b.hpMax*0.5;d.b.sta=100;d.b.kx=d.b.kz=0;d.b.roll=-1;pop('부활!',d.b);sfx('heal');}
  });
}

/* ---------- 동료의 판단 ---------- */
function ai(h,dt){
  if(gmode==='horde')return aiHorde(h,dt);
  const b=h.b,R=b.root.position,c={mx:0,mz:0},k=h.cls;
  let go=null,stop=0.4,act=true,danger=false,hold=false;
  const dB=Math.hypot(R.x,R.z)||1,toward=(x,z,s)=>{go={x,z};stop=s;};
  const tgt=targetOf(h),reach=(k==='ham'?REACH+0.7:k==='grp'?REACH-0.2:REACH)+(k==='ham'&&h.ultT>0?1.8:0);
  // 5. 평소 자리: 목표에 바짝 붙는다
  if(tgt.cry)toward(tgt.x,tgt.z,1.5);else toward(R.x/dB*(BOSS_R+1.2),R.z/dB*(BOSS_R+1.2),0.5);
  // 4. 수정: 맡은 수정을 거의 깨 놓고, 다 같이 준비되면 마무리한다
  if(tgt.cry){const cs=crystals.filter(q=>q.alive),ready=cs.every(q=>q.hp<=45)||cryst.win>0||cryst.t>11;if(tgt.cry.hp<=30&&!ready)act=false;}
  // 3. 쓰러진 동료 일으키기
  const down=heroes.filter(q=>q.b.dead>0);
  if(down.length){
    const d=down[0],helpers=alive().filter(q=>q!==me||AUTO).sort((p,q)=>dist(p.b.root.position,d.b.root.position)-dist(q.b.root.position,d.b.root.position));
    if(helpers[0]===h){toward(d.b.root.position.x,d.b.root.position.z,1.2);if(dist(R,d.b.root.position)<1.9)act=false;}
  }
  // 2. 모이기와 흩어지기
  for(const t of teles){
    if(t.kind==='stack'){if(t.follow!==h)toward(t.x,t.z,1.3);else{const o=alive().filter(q=>q!==h);if(o.length)toward(o[0].b.root.position.x,o[0].b.root.position.z,2);}}
    if(t.kind==='spread'&&t.follow===h){
      let ux=0,uz=0;alive().forEach(q=>{if(q===h)return;const K=q.b.root.position,d=dist(K,R)||0.1;if(d<8){ux+=(R.x-K.x)/d;uz+=(R.z-K.z)/d;}});
      if(ux||uz){toward(R.x+ux*4,R.z+uz*4,0);act=false;}
    }
  }
  // 1. 위험 범위: 가디언은 노려진 공격을 방패로 받아낸다 (닿기 직전에 올려 패링을 노린다). 나머지는 벗어난다
  for(const t of teles){
    if(t.kind!=='avoid'||t.t<0.3)continue;
    const d=dist(R,t);
    if(d>t.r+0.8)continue;
    danger=true;
    if(k==='grd'&&t.tank===h){if(t.dur-t.t<0.24)hold=true;continue;}
    let ux=(R.x-t.x)/(d||1),uz=(R.z-t.z)/(d||1);

    cutT+=dt;const u=Math.min(1,cutT/3.2);
    const z0=canvas.clientWidth<canvas.clientHeight?16:9.5;
    cam.position.set(LOB.x+Math.sin(u*0.5)*2,2.8+u*0.6,LOB.z+z0-u*(z0-2.5));cam.lookAt(LOB.x,2.3,LOB.z-4.6);
    fadeEl.style.opacity=Math.max(0,Math.min(1,(cutT-2.5)/0.7));
    if(cutT>3.4){   // 보스방으로
      state='cut2';cutT=0;reset();
      heroes.forEach(h=>{h.b.root.visible=h.b.shadow.visible=false;h.b.root.position.set(0,0,19.2);});
      portalA.g.visible=true;boss.g.visible=false;boss.g.position.y=-14;camYaw=0;lightsTo(true);caveG.visible=false;torchA.position.set(-6,3,17);torchB.position.set(6,3,17);
    }
  }else if(state==='cut2'){
    cutT+=dt;
    fadeEl.style.opacity=Math.max(0,1-cutT/0.6);
    const hd=gmode==='horde',rise=hd?0:Math.max(0,Math.min(1,(cutT-3.0)/2.2)),shake=!hd&&cutT>1.8&&cutT<5.4?(cutT<3?0.12:0.3)*(1-rise*0.5):0;
    // 카메라: 토끼들 뒤에서 전장 한가운데를 바라보다가 위로 훑는다
    cam.position.set(Math.sin(cutT*0.25)*3+(Math.random()-0.5)*shake,3.2+rise*1.5+(Math.random()-0.5)*shake,24-Math.min(1,cutT/2)*4);
    cam.lookAt(0,1.2+rise*5,0);
    if(!hd&&cutT>1.8){crack.visible=true;crack.scale.setScalar(Math.min(1,(cutT-1.8)/1.2));if(Math.floor(cutT*5)!==Math.floor((cutT-dt)*5))sfx('rumble');}
    if(!hd&&cutT>3.0){   // 바닥을 부수고 솟아오른다
      if(!boss.g.visible){boss.g.visible=true;sfx('roar');if(canBuzz&&buzzOn){try{navigator.vibrate(BUZZ.quake);}catch(e){}}debris.forEach(d=>{const a=Math.random()*6.283,s=2+Math.random()*7;d.m.visible=true;d.m.position.set(Math.cos(a)*2,0.3,Math.sin(a)*2);d.vx=Math.cos(a)*s;d.vz=Math.sin(a)*s;d.vy=9+Math.random()*9;});}
      const e=1-Math.pow(1-rise,3);boss.g.position.y=-14+14*e+(rise<1?Math.sin(cutT*40)*0.08:0);
      fists.forEach((f,i)=>{const b=f.userData.base,up=Math.max(0,Math.min(1,(cutT-5.2)/0.5))*(1-Math.max(0,Math.min(1,(cutT-6.3)/0.4)));f.position.set(b[0],b[1]+up*4,b[2]);});
    }
    debris.forEach(d=>{if(!d.m.visible)return;d.vy-=22*dt;const p=d.m.position;p.x+=d.vx*dt;p.y+=d.vy*dt;p.z+=d.vz*dt;d.m.rotation.x+=dt*5;d.m.rotation.z+=dt*4;
      if(p.y<0.3&&d.vy<0){p.y=0.3;d.vy=d.vy<-4?-d.vy*0.3:0;d.vx*=0.5;d.vz*=0.5;}});
    if(!hd&&cutT>5.2&&cutT-dt<=5.2){toast('별무리 거신');sfx('roar');}
    if(cutT>(hd?2.6:6.8)){   // 전투 시작
      state='fight';show('hud',true);portalA.g.visible=false;debris.forEach(d=>{d.m.visible=false;});camInit=false;
      say('도움말',me.cls==='grd'?'공격을 누르고 있으면 세 번 벱니다. 붉은 범위가 닿기 직전에 방패를 올리면 패링, 이어서 공격을 누르면 반격이에요.':me.cls==='ham'?'느리지만 세 번째 내려찍기가 아주 강해요. 투척으로 날아가 붙고, 점프 중에 공격하면 내려찍습니다.':'공격을 누르고 있으면 열 번 연타해요. 끝까지 넣을 때마다 빨라지고 세집니다. 배후 스킬로 적 뒤를 잡으세요.');
      say('도움말','구르기로 공격을 피하면 체력이 조금 차고, 포션은 세 개예요. 필살 스킬은 60초마다 쓸 수 있어요.');
      if(hd){say('도움말','사방에서 그림자 토끼가 몰려와요. 몸을 세우고 붉게 달아오르면 곧 덮치니, 먼저 때려서 끊거나 구르기로 피하세요.');say('도움말','한 물결을 다 잡으면 쓰러진 동료가 일어나요. 큰 놈은 느리지만 아프고, 작은 놈은 빨라요.');}
      else say('도움말','주황 범위는 피하고, 파란 범위는 셋이 모이고, 보라 범위는 흩어지고, 노란 충격파는 점프로 넘어요.');
    }
  }else{   // 대기실 카메라: 천천히 좌우로
    const tall=canvas.clientWidth<canvas.clientHeight;   // 세로 화면에서는 셋이 다 보이게 물러난다
    cam.position.set(LOB.x+Math.sin(time*0.3)*1.2,tall?3.6:2.9,LOB.z+(tall?16:9.5));cam.lookAt(LOB.x,tall?2.2:1.5,LOB.z-1);
    cam.updateMatrixWorld();
    tags.forEach((t,i)=>{if(t.hidden)return;const q=toScreen(heroes[i].sx,2.45,heroes[i].sz);t.style.transform='translate('+q.x+'px,'+q.y+'px) translate(-50%,-100%)';});
  }
  cam.updateMatrixWorld();
}

const v3=new T.Vector3(),camT=new T.Vector3();let camY=0,camInit=false;
function toScreen(x,y,z){v3.set(x,y,z).project(cam);return {x:(v3.x+1)/2*canvas.clientWidth,y:(1-v3.y)/2*canvas.clientHeight,ok:v3.z<1};}
function update(dt){
  if(freeze>0){freeze-=dt;dt*=0.03;}   // 타격 순간의 짧은 멈춤
  loadSamples();feelTick(dt);ghostTick(dt);
  time+=dt;musicTick();
  // 불꽃이 일렁이고, 그에 맞춰 불빛도 흔들린다
  portalTick(portalL,dt);portalTick(portalA,dt);
  flames.forEach(f=>{
    f.mat.uniforms.t.value=time;f.m.rotation.y=Math.atan2(cam.position.x-f.x,cam.position.z-f.z);   // 불꽃은 늘 카메라를 본다
    f.h.material.opacity=0.42+Math.sin(time*11+f.p)*0.06+Math.sin(time*23+f.p*2)*0.04;
    f.embers.forEach(e=>{e.p+=dt*0.45;if(e.p>1){e.p=0;e.dx=Math.random()-0.5;e.dz=Math.random()-0.5;}   // 불티가 날아오른다
      e.m.position.set(f.x+e.dx*(0.3+e.p*1.3),1.9+e.p*3.4,f.z+e.dz*(0.3+e.p*1.3));e.m.material.opacity=(1-e.p)*0.9;});
  });
  torchA.intensity=1.0+Math.sin(time*11)*0.1+Math.sin(time*23.7)*0.07;torchB.intensity=0.95+Math.sin(time*9.3+2)*0.1+Math.sin(time*19.1)*0.07;
  magic.intensity=1.5+Math.sin(time*3)*0.25;
  if(dlgQ.length){dlgT-=dt;if(dlgT<=0){dlgQ.shift();showDlg();}}
  if(toastT>0){toastT-=dt;toastEl.style.opacity=Math.min(1,toastT*2);if(toastT<=0)toastEl.hidden=true;}
  const fight=state==='fight';
  if(!fight&&state!=='won'&&state!=='wipe'){stageTick(dt);hud();return;}
  // 내 조작
  let mx=ix,mz=iy;
  if(keys.a||keys.arrowleft)mx-=1; if(keys.d||keys.arrowright)mx+=1;
  if(keys.w||keys.arrowup)mz-=1; if(keys.s||keys.arrowdown)mz+=1;
  if(keys.q){camYaw+=1.9*dt;lookT=2;} if(keys.e){camYaw-=1.9*dt;lookT=2;}
  const cy=Math.cos(camYaw),sy=Math.sin(camYaw),sx0=mx;
  mx=cy*sx0+sy*mz;mz=-sy*sx0+cy*mz;
  heroes.forEach(h=>{
    const b=h.b;let c={mx:0,mz:0};
    h.want=h.hold=false;
    if(fight&&b.dead<=0){
      if(h===me&&!AUTO){
        c={mx,mz,jump:wantJump,roll:wantRoll};h.want=atkHeld;h.hold=skillHeld;
        if(wantSkill)useSkill(h); if(wantUlt)useUlt(h); if(wantPotion)usePotion(h);
      }else c=ai(h,dt);
    }
    if(fight)heroTick(h,c,dt);
    updateBunny(b,c,dt);
    pose(h,dt);
    trailTick(h,dt);
  });
  wantJump=wantRoll=wantSkill=wantUlt=wantPotion=false;
  // 서로 겹치지 않게
  for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){
    const A=heroes[i].b,B=heroes[j].b;if(A.dead>0||B.dead>0||A.roll>=0||B.roll>=0)continue;
    const a=A.root.position,b=B.root.position,dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);
    if(d<0.9&&d>0.001){const p=(0.9-d)/2;a.x-=dx/d*p;a.z-=dz/d*p;b.x+=dx/d*p;b.z+=dz/d*p;}
  }
  if(fight){if(gmode==='horde')mobTick(dt);else bossTick(dt);fxTick(dt);if(state==='fight'&&!alive().length)finish(false);}
  else if(state==='won')bossTick(dt);

  // 카메라: 나를 가운데 두고, 보스가 늘 화면 안에 들어오게 뒤에서 따라간다
  const P=player.root.position;
  if(lookT>0)lookT-=dt;
  const hd=gmode==='horde';   // 그림자 떼 모드는 사방을 봐야 해서 더 멀리, 더 위에서 본다
  if(!hd&&lookId===null&&lookT<=0){let d=Math.atan2(P.x,P.z)-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));camYaw+=d*(1-Math.exp(-2.2*dt));}
  const pit=hd?Math.max(camPitch,0.3)+0.32:camPitch,cp=Math.cos(pit),D=hd?12.5:9.5;
  camY+=(P.y-camY)*(1-Math.exp(-5*dt));
  camT.set(P.x+Math.sin(camYaw)*cp*D,camY+1.6+Math.sin(pit)*D,P.z+Math.cos(camYaw)*cp*D);
  if(camInit)cam.position.lerp(camT,1-Math.exp(-16*dt));else{cam.position.copy(camT);camInit=true;}
  cam.lookAt(P.x,camY+(hd?1.2:2.4),P.z);
  if(shake>0.004){cam.position.x+=(Math.random()-0.5)*shake;cam.position.y+=(Math.random()-0.5)*shake;cam.position.z+=(Math.random()-0.5)*shake;shake*=Math.exp(-9*dt);}   // 맞거나 때릴 때의 흔들림
  cam.updateMatrixWorld();
  // 전장에서는 불빛 하나가 등불처럼 나를 따라오고, 하나는 거신 발치를 비춘다
  torchA.position.set(P.x+Math.sin(camYaw)*2.6,2.8,P.z+Math.cos(camYaw)*2.6);if(hd)torchB.position.set(P.x,8,P.z+0.01);else torchB.position.set(P.x*0.5,7.5,P.z*0.5+0.01);
  hud(dt);
}
function hud(dt){
  if(flashT>0&&dt){flashT-=dt;hitEl.style.background=flashC;hitEl.style.opacity=Math.max(0,Math.min(1,flashT*6));}else hitEl.style.opacity=0;
  const s=Math.floor(boss.clock);clockEl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const c=gmode==='horde'?null:boss.cast;
  if(gmode==='horde'){   // 보스 체력 자리에 이번 물결의 남은 적을 보여 준다
    bossHpEl.style.transform='scaleX('+(horde.rest>0?0:Math.min(1,horde.left/horde.total))+')';
    castT.hidden=true;castName.textContent=(horde.wave?horde.wave+'번째 물결 · ':'')+'처치 '+horde.kills+(horde.rest>0&&horde.wave?' · 다음 물결이 와요':horde.wave?' · 남은 적 '+horde.left:'');
  }else{
  bossHpEl.style.transform='scaleX('+boss.hp/boss.hpMax+')';
  castT.hidden=!c;castName.textContent=c?NAMES[c.kind]:boss.stun>0?'기절! 두 배 피해':'';
  }
  if(c)castFill.style.transform='scaleX('+(c.kind==='ult'?Math.max(0,boss.shield/1050):c.t/c.dur)+')';
  heroes.forEach((h,i)=>{frames[i].fill.style.transform='scaleX('+h.b.hp/h.b.hpMax+')';frames[i].row.classList.toggle('down',h.b.dead>0);});
  staEl.style.transform='scaleX('+player.sta/100+')';staT.classList.toggle('no',player.noSta>0);
  heroes.forEach((h,i)=>{frames[i].bar.style.transform='scaleX('+Math.min(1,h.barrier/h.b.hpMax)+')';});
  skillBtn.classList.toggle('cd',me.skCd>0);skillBtn.textContent=me.skCd>0?Math.ceil(me.skCd):me.k.skill;
  ultBtn.classList.toggle('cd',me.ultCd>0&&me.ultT<=0);ultBtn.classList.toggle('live',me.ultT>0);ultBtn.textContent=me.ultT>0?me.k.ult+' '+Math.ceil(me.ultT):me.ultCd>0?Math.ceil(me.ultCd):me.k.ult;
  potBtn.classList.toggle('cd',me.potions<=0);potBtn.textContent='포션 '+me.potions;
  buffEl.textContent=(me.counter>0?'반격 준비! 공격을 누르세요  ':'')+(me.cls==='grp'&&(me.stacks>0||me.ultT>0)?'콤보 중첩 '+(me.ultT>0?5:me.stacks)+'  ':'')+(me.cls==='grd'&&me.ultT>0?'무적 · 곁의 아군 '+me.wardN+'명, 공격력 +'+Math.round(WARD_ATK*100*me.wardN)+'%  ':'')+(me.barrier>1?'방어게이지 '+Math.round(me.barrier)+'  ':'')+(me.drink>0?'포션 마시는 중…':'');
  dmgEls.forEach(e=>{
    if(e.t<=0||!dt){e.d.hidden=true;return;}
    e.t-=dt;const q=toScreen(e.v.x,e.v.y+(0.6-e.t)*2,e.v.z);
    e.d.hidden=!q.ok;e.d.style.transform='translate('+q.x+'px,'+q.y+'px) translate(-50%,-50%) scale('+(1+Math.max(0,e.t-0.42)*3.2)+')';e.d.style.opacity=Math.min(1,e.t*4);   // 숫자가 크게 튀었다가 줄어든다
  });
  if(popT>0&&popB&&dt){
    popT-=dt;const q=toScreen(popB.root.position.x,popB.root.position.y+2.5,popB.root.position.z);
    popEl.hidden=false;popEl.style.transform='translate('+q.x+'px,'+(q.y-(0.7-popT)*40)+'px) translate(-50%,-100%)';
    popEl.style.opacity=Math.min(1,popT*3);
  }else popEl.hidden=true;
}
assign(0);reset();placeLobby();
tags.forEach((t,k)=>{t.textContent=CLS[k].name;});
if(my.nick){screen('menu');renderMenu();}else screen('nick');

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){
    renderer.setSize(w,h,false);cam.aspect=w/Math.max(1,h);cam.fov=w<h?56:45;cam.updateProjectionMatrix();
  }
}
shade(scene);
let last=performance.now(),warm=0,accT=0,accN=0,detail=0,shFrame=0;
if(COARSE&&lit){renderer.shadowMap.autoUpdate=false;}   // 폰에서는 그림자를 두 프레임에 한 번만 다시 그린다
function frame(now){
  const raw=(now-last)/1000,dt=Math.min(1/30,raw);last=now;
  resize();update(dt);
  // 해는 토끼를 따라다니며 그림자를 드리운다
  const SP=player.root.position;
  sun.position.set(SP.x+7,22,SP.z+9);sun.target.position.set(SP.x,0,SP.z);
  // 기기가 버거워하면 그림자를 끈다
  if(COARSE&&lit&&(shFrame++&1)===0)renderer.shadowMap.needsUpdate=true;
  warm+=raw;
  if(warm>3&&raw<0.5){
    accT+=raw;accN++;
    if(accT>=1.5){
      const fps=accN/accT;accT=0;accN=0;
      if(fps<40){
        if(PR>1.25){PR=1.25;renderer.setPixelRatio(PR);}
        else if(PR>1){PR=1;renderer.setPixelRatio(PR);}
        else if(lit&&sun.castShadow){sun.castShadow=false;toast('그림자를 껐어요 (기기 성능)');}
        else if(detail<2)detail++;
      }
    }
  }
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
