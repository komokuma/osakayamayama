:root{

<script>
(function(){
if(!window.THREE){document.getElementById('fail').hidden=false;return;}
const T=THREE, canvas=document.getElementById('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true});}catch(e){document.getElementById('fail').hidden=false;return;}
let PR=Math.min(window.devicePixelRatio||1,(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches)?1.5:2);
renderer.setPixelRatio(PR);
const scene=new T.Scene(); scene.background=new T.Color(0xcfe6f5); scene.fog=new T.Fog(0xdcebf5,45,105);
const cam=new T.PerspectiveCamera(45,1,0.3,110);

const INK=0x5a4a42, SPH=new T.SphereGeometry(1,28,20);
const lineMat=new T.MeshBasicMaterial({color:INK,side:T.BackSide});
/* ---------- 조명: 낮게 뜬 해, 부드러운 그림자, 하늘빛 반사 ---------- */
const COARSE=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;
scene.add(new T.HemisphereLight(0xffffff,0xd0d6e2,0.5));
const sun=new T.DirectionalLight(0xfff0d6,0.52); scene.add(sun); scene.add(sun.target);
const fill=new T.DirectionalLight(0xcfe0ff,0.12); fill.position.set(-8,6,-10); scene.add(fill);   // 그늘 쪽에 도는 푸른 반사광

  renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;

const flat=(c,o)=>o===undefined?new T.MeshStandardMaterial({color:c,roughness:0.5,metalness:0,envMapIntensity:0.3})

const toon=c=>flat(c);
// 그림자를 드리울 것과 받을 것을 정한다. 외곽선, 납작한 바닥, 꽃잎은 그림자를 드리우지 않는다
function shade(root){
  root.traverse(m=>{
    if(!m.isMesh)return;
    const mat=Array.isArray(m.material)?m.material[0]:m.material;
    if(!mat.isMeshStandardMaterial)return;
    m.receiveShadow=true;

}
// 타원체 + 손그림 느낌의 외곽선
function blob(rx,ry,rz,color,line){

  if(line!==0){const t=line||0.028,o=new T.Mesh(SPH,lineMat);o.scale.set(1+t/rx,1+t/ry,1+t/rz);m.add(o);}
  return m;
}
function dot(rx,ry,rz,mat){const m=new T.Mesh(SPH,mat);m.scale.set(rx,ry,rz);return m;}
const at=(o,x,y,z)=>{o.position.set(x,y,z);return o;};
const spring=()=>({x:0,v:0});
function step(s,target,k,d,dt){s.v+=(-k*(s.x-target)-d*s.v)*dt;s.x+=s.v*dt;}

const carG=new T.LatheGeometry([[0.03,0],[0.075,0.05],[0.11,0.3],[0.16,0.65],[0.2,0.92],[0.2,1.0],[0.16,1.08],[0.08,1.12],[0,1.13]].map(q=>new T.Vector2(q[0],q[1])),18);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));return new T.CanvasTexture(c);}
/* ---------- 세계: 낮의 오사카 도톤보리. 에비스바시 다리, 광고판 건물, 운하와 강변 산책로 ---------- */
const ARENA=58, CZ0=-13, CZ1=-3;                         // 운하 골짜기는 z -13 ~ -3 사이를 동서로 지난다
const BRIDGES=[{x:-30,hw:3.5},{x:0,hw:7},{x:30,hw:3.5}]; // 가운데가 넓은 에비스바시
const GAPS=[[-33.5,-26.5],[-7,7],[26.5,33.5]];           // 다리로 이어지는 남북 길

function slab(x,z,w,d,mat,y){const m=new T.Mesh(new T.PlaneGeometry(w,d),mat);m.rotation.x=-Math.PI/2;m.position.set(x,y||0,z);scene.add(m);return m;}
function box(w,h,d,mat,x,y,z,line){

  scene.add(m); return m;
}
// 바닥
const road=wet(0x9a9da3,0.85), paving=wet(0xd6cfc1,0.8), tile=wet(0xc4bdb0,0.8);

slab(0,7,14,20,paving,0.008); slab(0,-21.5,14,17,paving,0.008);   // 에비스바시로 이어지는 보행자 거리
// 운하: 아래로 꺼진 물길, 양옆의 낮은 강변 산책로
slab(0,-8,130,5,new T.MeshStandardMaterial({color:0x2c6a58,roughness:0.14,metalness:0.1,envMapIntensity:0.55}),-2.4);
const stone=wet(0xb9bcc0,0.8), railMat=wet(0x8e949b,0.5), postAt=[];
[[-11.75,1],[-4.25,-1]].forEach(([z,s])=>{

  box(130,0.08,0.08,railMat,0,-0.75,z+s*1.2);                     // 물가 난간

});
{ const im=new T.InstancedMesh(new T.BoxGeometry(0.08,0.75,0.08),railMat,postAt.length), mt=new T.Matrix4();
  postAt.forEach((q,i)=>{mt.makeTranslation(q[0],q[1],q[2]);im.setMatrixAt(i,mt);}); im.frustumCulled=false; scene.add(im); }
BRIDGES.forEach(b=>{
  const big=b.hw>5;
  box(b.hw*2,0.6,CZ1-CZ0,big?paving:road,b.x,-0.31,-8);                                   // 다리 상판
  [-1,1].forEach(s=>{
    box(0.45,1.0,CZ1-CZ0,stone,b.x+s*(b.hw-0.1),0.5,-8,true);                              // 돌 난간
    box(b.hw*2,2.0,0.5,stone,b.x,-1.6,-8+s*4.6);                                           // 다릿발
  });
});
// 건물: 밝은 콘크리트 벽, 창문 줄, 1층 가게와 세로 간판 (가게 이름은 모두 지어낸 것)
const SIGNC=['#e8452c','#1f6fd1','#f2a31b','#1e9c5a','#d43b8a','#444b57'];
const SHOPS=['당근야키','토끼라멘','たこ焼き','ラーメン','お好み焼き','串カツ','カラオケ','당근주스','토끼사진관','오락실','居酒屋','당근빵'];
function facade(i){return canvasTex(256,512,g=>{
  g.fillStyle=['#e9e6df','#d9dde2','#f2efe6','#cfd6dc','#e6dccb','#dcd3c6'][i%6];g.fillRect(0,0,256,512);
  for(let r=0;r<9;r++){
    g.fillStyle='rgba(0,0,0,.08)';g.fillRect(0,10+r*40,256,3);
    for(let c=0;c<5;c++){g.fillStyle=rnd()<0.75?'#5d6f82':'#8fa6ba';g.fillRect(16+c*47,18+r*40,34,26);}
  }
  const a=SIGNC[i%6],b=SIGNC[(i+2)%6];
  g.fillStyle=a;g.fillRect(8,380,240,58);g.fillStyle='#fff';g.font='bold 40px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(SHOPS[i%SHOPS.length],128,410);
  g.fillStyle='#2f3640';g.fillRect(20,444,216,68);g.fillStyle='#ffe9a8';g.fillRect(30,452,90,60);g.fillStyle='#cfe6f5';g.fillRect(132,452,94,60);   // 가게 입구와 진열창
  g.fillStyle=b;g.fillRect(i%2?200:12,96,44,268);g.fillStyle='#fff';g.font='bold 32px sans-serif';
  const t=SHOPS[(i+5)%SHOPS.length];for(let k=0;k<Math.min(5,t.length);k++)g.fillText(t[k],(i%2?200:12)+22,128+k*50);
});}
const fronts=[]; for(let i=0;i<8;i++)fronts.push(new T.MeshStandardMaterial({map:facade(i),roughness:0.85,envMapIntensity:0.2}));
const roofMat=wet(0x8b9096,0.9);
const obstacles=[];
function building(x,z,w,d,h,i){
  const f=fronts[i%8], m=new T.Mesh(new T.BoxGeometry(w,h,d),[f,f,roofMat,roofMat,f,f]); m.position.set(x,h/2,z); scene.add(m);
  obstacles.push({x,z,hw:w/2,hd:d/2,h:99,r:Math.hypot(w/2,d/2)});
}

function row(z0,z1,gaps,i,tall){
  let a=-56;
  gaps.concat([[56,56]]).forEach(([g0,g1])=>{
    const n=Math.max(1,Math.round((g0-a)/8)), w=(g0-a)/n;
    for(let k=0;k<n&&g0-a>1;k++)building(a+w*(k+0.5),(z0+z1)/2,w-0.12,z1-z0,tall?tall(a+w*(k+0.5)):8+rnd()*7,i++);

// 발밑 높이: 충분히 높이 떠 있을 때만 장애물 윗면이 바닥이 된다
function floorAt(x,z,y){let f=0;for(const o of obstacles){if(y>=o.h-STEP&&o.h>f&&inside(o,x,z,0.1))f=o.h;}return f;}
// 윗면보다 낮으면 옆면에 막힌다. 운하는 다리로만 건널 수 있다
function pushOut(P,y,rad){
  let hit=null;
  for(const o of obstacles){
    if(y>=o.h-STEP)continue;
    const dx=P.x-o.x,dz=P.z-o.z;
    if(o.hw){
      const px=o.hw+rad,pz=o.hd+rad,ax=Math.abs(dx),az=Math.abs(dz);
      if(ax<px&&az<pz){if(px-ax<pz-az)P.x=o.x+(dx<0?-px:px);else P.z=o.z+(dz<0?-pz:pz);hit=o;}
      continue;
    }
    if(dx>3||dx<-3||dz>3||dz<-3)continue;
    const d=Math.hypot(dx,dz),m=o.r+rad;
    if(d<m){if(d>0.001){P.x=o.x+dx/d*m;P.z=o.z+dz/d*m;}else P.x=o.x+m;hit=o;}
  }
  if(P.z>CZ0-rad&&P.z<CZ1+rad){
    const b=onBridge(P.x,0.5), lim=b?Math.max(0.05,b.hw-0.4-rad):0;
    if(b)P.x=Math.max(b.x-lim,Math.min(b.x+lim,P.x));           // 다리 위에서는 난간 안쪽에 머문다
    else P.z=P.z<(CZ0+CZ1)/2?CZ0-rad:CZ1+rad;
  }
  return hit;
}
// 길 찾기: 북쪽 거리(N), 도톤보리 거리(S), 그 사이를 잇는 남북 길과 다리(C). 지금 향해야 할 중간 지점을 돌려준다
const zoneOf=z=>z<-22?'N':z>5?'S':'C';
const nearBridge=x=>BRIDGES.reduce((a,b)=>Math.abs(b.x-x)<Math.abs(a.x-x)?b:a);
function via(R,tx,tz){
  const zr=zoneOf(R.z), zt=zoneOf(tz);
  if(zr==='C'){
    const b=nearBridge(R.x);
    if(zt==='C')return nearBridge(tx)===b?null:{x:b.x,z:8};
    return Math.abs(tx-b.x)<b.hw-1?null:{x:b.x,z:zt==='N'?-24.5:8};
  }
  if(zr===zt)return null;
  let b=BRIDGES[0],best=1e9;
  if(zt==='C')b=nearBridge(tx);
  else for(const k of BRIDGES){const c=Math.abs(k.x-R.x)+Math.abs(k.x-tx);if(c<best){best=c;b=k;}}
  if(Math.abs(R.x-b.x)<b.hw-1.2)return zt==='C'?null:{x:b.x,z:zr==='S'?-24.5:8};
  return {x:b.x,z:zr==='S'?8.5:-25};
}

function mold(geo,grow,list){
  const P=geo.attributes.position, n=P.count, base=new Float32Array(n*3), wl=new Float32Array(n), wr=new Float32Array(n);
  for(let i=0;i<n;i++){
    const x=P.getX(i),y=P.getY(i),z=P.getZ(i);
    const w=Math.exp(-Math.pow((y+0.46)/0.34,2)), top=y>0?0.12*y:0;
    const dl=(x+0.6)*(x+0.6)+(y+0.42)*(y+0.42)+(z-0.62)*(z-0.62), dr=(x-0.6)*(x-0.6)+(y+0.42)*(y+0.42)+(z-0.62)*(z-0.62);
    const b=0.12*(Math.exp(-dl/0.16)+Math.exp(-dr/0.16));
    const X=x*0.6*(1+0.22*w-top)*(1+b), Y=y*(y<0?0.48:0.56)*(1+b*0.3), Z=z*0.55*((z>0?1+0.17*w:1+0.04*w)-top)*(1+b);
    base[i*3]=X*grow;base[i*3+1]=Y*grow;base[i*3+2]=Z*grow;
    wl[i]=Math.exp(-dl/0.3);wr[i]=Math.exp(-dr/0.3);
    P.setXYZ(i,base[i*3],base[i*3+1],base[i*3+2]);
  }
  list.push({P,base,wl,wr,n}); return geo;
}

// 배경음악: 도-라-파-솔 화음 위로 통통 튀는 가락이 계속 돈다

const TUNE=[72,76,79,76,84,79,76,79, 72,76,81,76,84,81,76,81, 72,77,81,77,84,81,77,81, 74,79,83,79,86,83,79,74,

function musicTick(){

  while(nextNote<AC.currentTime+0.25){

/* ---------- 전투 규칙 ---------- */
const SPEED=4.6, ROLL_T=0.42, ROLL_SP=9.5, REST_X=0.3, REST_Z=-0.45;
const COST={jump:18,roll:25,hit:15,dash:30}, DASH_T=0.32, DASH_SP=14, DASH_DMG=15;
let time=0,kos=0,popT=0,popB=null;
const nEl=$('n'),hpEl=$('hp'),staEl=$('sta'),staTrack=$('staT'),popEl=$('pop');

function spend(b,c){if(b.sta<c){b.noSta=0.35;if(!b.quiet)sfx('no');return false;}b.sta-=c;b.rest=0;return true;}
function boing(b,k){
  b.ears.forEach(e=>{e.a.v+=5*k*(1+e.side*0.2);e.b.v+=9*k;e.z.v+=3*k;});
  b.cheeks.forEach(c=>{c.s.v-=1.1*k;});
}
function pop(text,b){if(text==='회피!')sfx('dodge');popEl.textContent=text;popT=0.7;popB=b;}
function respawn(b){
  b.hp=b.hpMax;b.sta=100;b.dead=0;b.dash=-1;b.vx=b.vz=b.kx=b.kz=0;b.jy=0;b.air=false;b.swing=-1;b.roll=-1;
  b.spin.rotation.set(0,0,0);b.spin.position.y=PIV;b.spin.scale.setScalar(1);
  b.root.position.set(2.5,0,-8);heat=0;
  enemies.forEach(e=>{if(e.team==='g'){e.gone=true;e.silent=true;}});
  cars.forEach(c=>{if(c.state!=='idle'){c.state='home';c.load=0;c.t=0;}});
  toast('기절했다 깨어났어요');
}
function hurt(o,b,h,dmg){
  o.hp=Math.max(0,o.hp-(dmg||b.dmg));o.hurt=0.22;o.kx=h.dx*7;o.kz=h.dz*7;o.swing=-1;o.alert=10;boing(o,2.2);sfx(o===player?'ouch':'hit');
  { const R=o.root.position,big=(dmg||b.dmg)>=12;
    bleed(R.x,o.jy+0.8*o.sc,R.z,h.dx,h.dz,big?12:6,big?4.5:3);
    if(o.hp<=0){bleed(R.x,o.jy+0.8*o.sc,R.z,h.dx,h.dz,22,5.5);stain(R.x,R.z,0.75*o.sc);stain(R.x+h.dx*0.7,R.z+h.dz*0.7,0.5*o.sc);sfx('splat');} }
  if(b===player){
    trouble(0.15);
    enemies.forEach(e=>{if(e.team==='v'&&Math.hypot(e.root.position.x-o.root.position.x,e.root.position.z-o.root.position.z)<12)e.alert=Math.max(e.alert,8);});
  }
  if(o.hp<=0){
    if(o.ride)toggleRide();
    o.dead=o===player?2.6:1.8;o.dt=0;o.roll=-1;o.air=false;o.jv=0;
    if(o!==player){kos++;nEl.textContent=kos;if(b===player)trouble(o.team==='g'?1.5:1);}
    pop('KO!',o);sfx('ko');
    if(sawKill&&o!==player)gib(o,h);
  }
}
// 당근이 지나간 선이 아니라, 앞쪽 부채꼴 전체가 맞는 범위
function strike(b){
  const R=b.root.position,fx=Math.sin(b.face),fz=Math.cos(b.face);
  b.fanT=0.25;sfx('swing',b.quiet);
  const inFan=(x,z,rad)=>{
    const dx=x-R.x,dz=z-R.z,d=Math.hypot(dx,dz);
    if(d>REACH+rad)return null;
    if(d>0.45&&(dx*fx+dz*fz)/d<Math.cos(FAN))return null;
    return {dx:dx/(d||1),dz:dz/(d||1)};
  };
  bunnies.forEach(o=>{
    if(o===b||o.dead>0||!hostile(b,o))return;
    const h=inFan(o.root.position.x,o.root.position.z,0.4);
    if(!h||Math.abs(o.jy-b.jy)>1.0)return;   // 높이 차이가 크면 닿지 않는다
    if(o.roll>=0){pop('회피!',o);return;}   // 구르는 동안은 모든 공격을 피한다
    sawKill=b===player&&sawing;hurt(o,b,h);sawKill=false;   // 톱을 든 채 휘두르면 톱으로 베는 것
  });
  if(!b.enemy&&b.jy<1.0)turnips.forEach(t=>{
    const h=inFan(t.g.position.x,t.g.position.z,0.4);
    if(h){t.s.v+=10;t.vx=h.dx*5;t.vz=h.dz*5;t.axis.set(h.dz,0,-h.dx);}
  });
}
function springs(b,k,dt){
  b.ears.forEach(e=>{
    step(e.a,-0.3*k-(b.air?b.jv*0.05:0),120,4.5,dt); step(e.b,0,90,4,dt); step(e.z,0,110,5,dt);
    e.p.rotation.x=-0.08+e.a.x; e.p.rotation.z=-e.side*(0.07+e.z.x*0.5);
    const st=Math.max(-0.22,Math.min(0.28,e.b.x*0.25));
    e.p.scale.set(1-st*0.5,1+st,1-st*0.5);
  });
  b.cheeks.forEach(c=>step(c.s,0,c.k,4.2,dt));
  const lim=v=>Math.max(-0.12,Math.min(0.12,v)), oL=lim(b.cheeks[0].s.x), oR=lim(b.cheeks[1].s.x);
  // 볼살이 거의 멈췄거나 멀리 있으면 꼭짓점 계산을 건너뛴다
  const calm=b.lod>0||Math.abs(oL)+Math.abs(oR)<0.004;
  if(calm&&b.still)return;
  b.still=calm;
  const qL=calm?0:oL,qR=calm?0:oR;
  b.soft.forEach(m=>{
    for(let i=0;i<m.n;i++){
      const d=m.wl[i]*qL+m.wr[i]*qR, a=m.wl[i]*Math.abs(qL)+m.wr[i]*Math.abs(qR);
      m.P.setXYZ(i,m.base[i*3]*(1+a*0.6),m.base[i*3+1]+d,m.base[i*3+2]*(1+a*0.4));
    }
    m.P.needsUpdate=true;
  });
}

function updateBunny(b,c,dt){
  const R=b.root.position;
  if(b.hurt>0){b.hurt-=dt;b.fur.color.setHex(b.hurt>0?b.o.hurt:b.o.fur);}
  if(b.noSta>0)b.noSta-=dt;
  b.rest+=dt; if(b.rest>0.7)b.sta=Math.min(100,b.sta+26*dt);
  b.fan.visible=false;

  if(b.dead>0){ // 쓰러짐
    b.dead-=dt;b.dt+=dt;
    const u=Math.min(1,b.dt/0.3);
    b.spin.rotation.set(0,0,u*Math.PI/2);b.spin.position.y=PIV-u*0.3;
    R.x+=b.kx*dt;R.z+=b.kz*dt;const f=Math.exp(-6*dt);b.kx*=f;b.kz*=f;
    pushOut(R,b.jy,BODY);
    const df=floorAt(R.x,R.z,b.jy);
    if(b.jy>df){b.jv-=19*dt;b.jy=Math.max(df,b.jy+b.jv*dt);}
    R.y=b.jy;b.shadow.position.y=df+0.02;
    springs(b,0,dt);
    b.shadow.position.x=R.x;b.shadow.position.z=R.z;
    if(b.jy<0.1&&Math.random()<dt*5)stain(R.x+(Math.random()-0.5)*0.9,R.z+(Math.random()-0.5)*0.9,0.2+Math.random()*0.25);   // 피 웅덩이가 번진다
    if(b.dead<=0){if(b===player)respawn(b);else b.gone=true;}
    return;
  }

  if(b.ride)c={mx:c.mx,mz:c.mz,jump:c.jump};   // 타고 있을 때는 운전과 점프만
  let mx=c.mx||0,mz=c.mz||0; const ml=Math.hypot(mx,mz); if(ml>1){mx/=ml;mz/=ml;}
  if(b.ai&&b.swing>=0){mx=0;mz=0;}

  // 구르기: 시작부터 끝까지 무적
  if(c.roll&&b.roll<0&&!b.air&&spend(b,COST.roll)){
    b.roll=0;b.swing=-1;b.dash=-1;
    if(ml>0.2){b.rdx=mx/Math.min(1,ml);b.rdz=mz/Math.min(1,ml);const l=Math.hypot(b.rdx,b.rdz);b.rdx/=l;b.rdz/=l;}
    else{b.rdx=Math.sin(b.face);b.rdz=Math.cos(b.face);}
    b.face=Math.atan2(b.rdx,b.rdz);boing(b,1.2);sfx('roll',b.quiet);
  }
  if(b.roll>=0){
    b.roll+=dt;const u=b.roll/ROLL_T,s=ROLL_SP*(1-0.45*u);
    b.vx=b.rdx*s;b.vz=b.rdz*s;
    if(u>=1){b.roll=-1;b.vx*=0.4;b.vz*=0.4;boing(b,1.3);b.land=0.12;}
  }
  // 돌진: 보고 있는 방향으로 곧게 튀어 나가며 부딪힌 상대를 날려 보낸다
  if(c.dash&&b.dash<0&&b.roll<0&&spend(b,COST.dash)){
    b.dash=0;b.swing=-1;b.ddx=Math.sin(b.face);b.ddz=Math.cos(b.face);b.dashHit=[];boing(b,-1.5);sfx('dash',b.quiet);
  }
  if(b.roll>=0){}
  else if(b.dash>=0){
    b.dash+=dt;const u=b.dash/DASH_T,s=DASH_SP*(1-0.3*u);
    b.vx=b.ddx*s;b.vz=b.ddz*s;
    bunnies.forEach(o=>{
      if(o===b||o.dead>0||!hostile(b,o)||b.dashHit.includes(o))return;
      const dx=o.root.position.x-R.x,dz=o.root.position.z-R.z;
      if(Math.hypot(dx,dz)>1.1||Math.abs(o.jy-b.jy)>1.0)return;
      b.dashHit.push(o);
      if(o.roll>=0){pop('회피!',o);return;}
      sawKill=b===player&&sawing;hurt(o,b,{dx:b.ddx,dz:b.ddz},DASH_DMG);sawKill=false;o.kx=b.ddx*11;o.kz=b.ddz*11;
    });
    if(!b.enemy&&b.jy<1.0)turnips.forEach(t=>{
      const dx=t.g.position.x-R.x,dz=t.g.position.z-R.z;
      if(Math.hypot(dx,dz)<1.0&&!b.dashHit.includes(t)){b.dashHit.push(t);t.s.v+=12;t.vx=b.ddx*8;t.vz=b.ddz*8;t.axis.set(b.ddz,0,-b.ddx);}
    });
    if(u>=1){b.dash=-1;b.vx*=0.3;b.vz*=0.3;boing(b,1.5);}
  }else if(b.ride){   // 오토바이: 스틱 방향으로 서서히 꺾으며 달린다
    const bk=b.ride;
    if(ml>0.15){
      let d=Math.atan2(mx,mz)-bk.face;d=Math.atan2(Math.sin(d),Math.cos(d));
      const t=Math.max(-3.4*dt,Math.min(3.4*dt,d));
      bk.face+=t;bk.turn+=(t/dt-bk.turn)*0.2;
      bk.sp+=(Math.min(1,ml)*BIKE_SP*(Math.abs(d)>2?0.4:1)-bk.sp)*(1-Math.exp(-2.2*dt));
    }else{bk.sp*=Math.exp(-1.6*dt);bk.turn*=0.85;}
    if(b.blocked)bk.sp*=0.6;
    b.vx=Math.sin(bk.face)*bk.sp;b.vz=Math.cos(bk.face)*bk.sp;b.face=bk.face;
  }else{
    const ease=1-Math.exp(-10*dt);
    b.vx+=(mx*b.speed-b.vx)*ease;b.vz+=(mz*b.speed-b.vz)*ease;
  }
  const sp=Math.hypot(b.vx,b.vz),k=Math.min(1,sp/SPEED);
  R.x+=(b.vx+b.kx)*dt;R.z+=(b.vz+b.kz)*dt;
  const kf=Math.exp(-7*dt);b.kx*=kf;b.kz*=kf;
  const pr=Math.hypot(R.x,R.z); if(pr>ARENA){R.x*=ARENA/pr;R.z*=ARENA/pr;}
  const blk=pushOut(R,b.jy,BODY); b.blocked=blk?blk.h:0;
  if(b.roll<0&&b.dash<0&&!b.ride){
    let tg=null; if(c.aim!==undefined)tg=c.aim; else if(sp>0.3)tg=Math.atan2(b.vx,b.vz);
    if(tg!==null){let d=tg-b.face;d=Math.atan2(Math.sin(d),Math.cos(d));b.face+=d*(1-Math.exp(-14*dt));}
  }
  b.root.rotation.y=b.face;

  // 깡총깡총
  const rolling=b.roll>=0, dashing=b.dash>=0||!!b.ride;
  if(!rolling&&!dashing)b.phase+=sp*dt*2.5;
  const beat=Math.floor(b.phase/Math.PI);
  if(beat!==b.lastBeat){b.lastBeat=beat;if(k>0.2&&!b.air){boing(b,k);if(b===player||Math.hypot(R.x-player.root.position.x,R.z-player.root.position.z)<7)sfx('step',b.quiet);}}
  const hop=(rolling||dashing)?0:Math.abs(Math.sin(b.phase))*k, breathe=Math.sin(time*2.4+(b.enemy?1:0))*0.015;

  // 점프
  const fl=floorAt(R.x,R.z,b.jy);
  if(c.jump&&!b.air&&!rolling&&spend(b,COST.jump)){b.air=true;b.jv=7.2;boing(b,-0.8);sfx('jump',b.quiet);}
  if(!b.air&&b.jy>fl+0.02){b.air=true;b.jv=0;}   // 가장자리에서 걸어 나가면 떨어진다
  if(b.air){
    b.jv-=19*dt;b.jy+=b.jv*dt;
    if(b.jv<=0&&b.jy<=fl){b.jy=fl;b.air=false;boing(b,1.6+Math.min(1,-b.jv/8));b.land=0.22;b.jv=0;sfx('land',b.quiet);}
  }else b.jy=fl;
  if(b.land>0)b.land-=dt;
  R.y=b.jy;
  const hopG=b.air?0:hop;
  b.bod.position.y=-PIV+hopG*0.24+(b.ride?SEAT:0);
  const sq=1+(hopG-0.45*k)*0.16+breathe+(b.air?Math.max(-0.1,Math.min(0.22,b.jv*0.03)):0)-Math.max(0,b.land)*1.3;
  b.bod.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));
  if(rolling){b.spin.rotation.set(b.roll/ROLL_T*Math.PI*2,0,0);b.spin.scale.setScalar(0.86);b.spin.position.y=PIV*0.86-0.04;}
  else{b.spin.rotation.set(0,0,b.ride?-b.ride.turn*0.1:0);b.spin.scale.setScalar(1);b.spin.position.y=PIV;}
  b.feet.forEach((f,i)=>{
    const s=Math.sin(b.phase+(i?Math.PI:0));
    f.position.y=0.12+Math.max(0,s)*0.1*k;f.position.z=0.06+Math.cos(b.phase+(i?Math.PI:0))*0.14*k;
  });
  b.shadow.position.x=R.x;b.shadow.position.z=R.z;b.shadow.position.y=fl+0.02;b.shadow.scale.setScalar(b.sc*Math.max(0.45,1-hopG*0.3-(b.jy-fl)*0.28));

  // 당근 휘두르기
  if(c.hit&&b.swing<0&&!rolling&&!dashing&&spend(b,COST.hit)){b.swing=0;b.hitDone=false;boing(b,0.9);}
  let ax=REST_X+Math.sin(b.phase)*0.35*k,lean=0.12*k;
  if(b.swing>=0){
    b.swing+=dt;const t=b.swing,W=b.wind;
    if(t<W){ax=REST_X+(-1.2-REST_X)*(t/W);lean=-0.12*(t/W);}
    else if(t<W+0.1){const u=(t-W)/0.1;ax=-1.2+3.3*u*u;lean=0.35*u;}
    else if(t<W+0.31){const u=(t-W-0.1)/0.21;ax=2.1+(REST_X-2.1)*u*u*(3-2*u);lean=0.35*(1-u);}
    else b.swing=-1;
    if(b.enemy&&t<W){b.fan.visible=true;b.fanMat.opacity=0.22*(t/W);}  // 까만토끼는 때리기 전에 범위를 미리 보여준다
    if(!b.hitDone&&t>=W+0.07){b.hitDone=true;strike(b);boing(b,0.7);}
  }
  if(b.fanT>0){b.fanT-=dt;b.fan.visible=true;b.fanMat.opacity=0.42*Math.max(0,b.fanT)/0.25;}
  if(b.fan.visible){b.fan.position.set(R.x,b.jy+0.03,R.z);b.fan.rotation.y=b.face;}
  if(dashing){ax=1.5;lean=0.55;}
  if(b.ride){ax=1.25;lean=0.18;}
  if(b.sawT>0){b.sawT-=dt;if(b.swing<0&&b.dash<0&&!b.ride){ax=1.42;lean=0.22;}ax+=Math.sin(time*95)*0.07;}   // 전기톱을 앞으로 내밀고 부르르
  if(b.shootT>0){b.shootT-=dt;ax=1.5+Math.sin(time*60)*0.06;}   // 당근을 앞으로 겨누고 덜덜덜   // 당근을 앞으로 내밀고 몸을 숙인다
  b.arm.rotation.set(ax,0,(dashing||b.sawT>0)?-0.1:REST_Z);
  b.armL.position.z=0.12-Math.sin(b.phase)*0.12*k;
  b.bod.rotation.x=lean;

  b.twitch-=dt; if(b.twitch<0){b.twitch=1.8+Math.random()*2;if(k<0.2){const e=b.ears[Math.random()<0.5?0:1];e.a.v+=3.5;e.b.v+=5;}}
  if(b.ride){
    const bk=b.ride;

// 까만토끼: 다가와서 범위를 예고하고 내려친 뒤, 잠깐 물러난다
function think(e,p,dt){
  const c=think0(e,p,dt);
  if(e.dead<=0&&p.dead<=0&&!e.air&&e.swing<0&&!c.roll){
    if(e.blocked){
      if(e.blocked<=1.05)c.jump=true;                       // 낮은 장애물은 뛰어오른다
      else{const t=c.mx;c.mx-=c.mz*e.side;c.mz+=t*e.side;}  // 높은 바위는 돌아간다
    }else if(p.jy-e.jy>0.4&&Math.hypot(p.root.position.x-e.root.position.x,p.root.position.z-e.root.position.z)<2.6)c.jump=true;
  }
  return c;
}
function think0(e,p,dt){
  const c={mx:0,mz:0};
  e.think-=dt;e.cool-=dt;
  if(p.swing<0)e.dodged=false;
  if(p.dead>0||e.dead>0)return c;
  const dx=p.root.position.x-e.root.position.x,dz=p.root.position.z-e.root.position.z,d=Math.hypot(dx,dz)||1,ux=dx/d,uz=dz/d;
  if(p.swing>=0&&!e.dodged&&d<REACH+0.8){
    e.dodged=true;
    if(Math.random()<0.35&&e.sta>=COST.roll&&e.swing<0){c.roll=true;c.mx=-ux+uz*e.side*0.6;c.mz=-uz-ux*e.side*0.6;return c;}
  }
  if(e.swing>=0){c.aim=Math.atan2(ux,uz);return c;}
  if(e.mode==='back'){
    c.mx=-ux*0.5+uz*e.side*0.8;c.mz=-uz*0.5-ux*e.side*0.8;
    if(e.think<0)e.mode='chase';
  }else if(d>REACH-0.4){c.mx=ux;c.mz=uz;}
  else if(e.cool<=0&&e.sta>=COST.hit){
    c.hit=true;c.aim=Math.atan2(ux,uz);e.cool=1.4+Math.random();e.mode='back';e.think=1.2+Math.random()*0.8;e.side=Math.random()<0.5?-1:1;
  }else{c.mx=uz*e.side*0.5;c.mz=-ux*e.side*0.5;c.aim=Math.atan2(ux,uz);}
  return c;
}

function unload(c){

    const s=i%2?1:-1,x=c.g.position.x+Math.cos(c.face)*1.3*s,z=c.g.position.z-Math.sin(c.face)*1.3*s;

function carTick(dt){
  const P=player.root.position;let siren=false;
  for(const c of cars){
    if(c.state==='idle')continue;
    const p=c.g.position;c.t+=dt;if(c.ramT>0)c.ramT-=dt;
    const flash=c.state==='go'&&Math.floor(time*6)%2;
    c.red.visible=c.state!=='go'||!!flash;c.blue.visible=c.state!=='go'||!flash;
    let tx=P.x,tz=P.z,go=false,goal=null;
    if(c.state==='go'){
      go=true;const d=Math.hypot(P.x-p.x,P.z-p.z);
      if(d<34)siren=true;
      if(stars===0||player.dead>0){c.state='home';c.load=0;}
      else if((d<5.5&&c.sp<7)||d<3.5||c.t>40)unload(c);
      else if(d<9)c.sp*=Math.exp(-2.5*dt);   // 다가오면 속도를 줄인다
      // 어딘가에 끼이면 그 자리에서 내린다
      c.stuck+=dt;if(c.stuck>1.6){if(Math.hypot(p.x-c.lx,p.z-c.lz)<1.2)unload(c);c.stuck=0;c.lx=p.x;c.lz=p.z;}
    }else if(c.state==='park'){
      c.sp*=Math.exp(-5*dt);
      if(c.t>6&&(stars===0||c.t>30)){c.state='home';c.t=0;}
    }
    if(c.state==='home'){
      go=true;tx=DOOR.x;tz=DOOR.z+0.6;
      if(Math.hypot(tx-p.x,tz-p.z)<2.5||c.t>60){c.state='idle';c.g.visible=false;continue;}
    }
    if(go){
      goal=via(p,tx,tz); if(goal){tx=goal.x;tz=goal.z;}   // 운하 건너편이면 다리로 돌아간다
      let da=Math.atan2(tx-p.x,tz-p.z)-c.face;da=Math.atan2(Math.sin(da),Math.cos(da));
      c.face+=Math.max(-2.4*dt,Math.min(2.4*dt,da));
      c.sp+=(CAR_SP*(Math.abs(da)>1.2?0.45:1)-c.sp)*(1-Math.exp(-1.8*dt));
    }
    p.x+=Math.sin(c.face)*c.sp*dt;p.z+=Math.cos(c.face)*c.sp*dt;
    const hit=pushOut(p,0,1.15); if(hit){c.sp*=0.9;c.face+=2.2*dt*(((hit.x-p.x)*Math.cos(c.face)-(hit.z-p.z)*Math.sin(c.face))>0?-1:1);}   // 장애물을 비껴 돈다
    c.g.rotation.y=c.face;c.wheels.forEach(w=>{w.rotation.x+=c.sp*dt/0.36;});
    // 주인공과 부딪히면 밀어내고, 달리던 중이면 들이받는다
    const dx=P.x-p.x,dz=P.z-p.z,d=Math.hypot(dx,dz);
    if(d<1.5&&d>0.01&&player.dead<=0&&player.roll<0&&player.jy<1.2){
      P.x=p.x+dx/d*1.5;P.z=p.z+dz/d*1.5;

    }
  }
  sirenT-=dt; if(siren&&sirenT<=0){sirenT=0.36;sirenHi=!sirenHi;tone(sirenHi?740:560,0.34,'square',0.03);}   // 삐뽀삐뽀
}

function goTo(b,x,z,stop,sp){
  const dx=x-b.root.position.x,dz=z-b.root.position.z,d=Math.hypot(dx,dz),c={mx:0,mz:0};
  if(d>stop){
    c.mx=dx/d*sp;c.mz=dz/d*sp;
    if(b.blocked&&!b.air){if(b.blocked<=1.05)c.jump=true;else{const t=c.mx;c.mx-=c.mz*b.side;c.mz+=t*b.side;}}
  }
  return c;
}

function villagerCtrl(v,dt){

  const R=v.root.position,P=player.root.position,dx=R.x-P.x,dz=R.z-P.z,d=Math.hypot(dx,dz)||1;
  if(v.alert>0&&d<24){v.speed=5.2;return goTo(v,R.x+dx/d*6,R.z+dz/d*6,0,1);}

  if(v.wt<=0){v.wt=2+Math.random()*4;v.idle=Math.random()<0.35;v.tx=v.home.x+(Math.random()-0.5)*10;v.tz=v.home.z+(Math.random()-0.5)*10;}
  return v.idle?{mx:0,mz:0}:goTo(v,v.tx,v.tz,0.6,1);
}
// 경찰 토끼: 수배 중이면 끝까지 쫓아오고, 수배가 풀리면 경찰서로 돌아간다
function guardCtrl(e,dt){
  const R=e.root.position,P=player.root.position;
  if(stars===0||player.dead>0){   // 수배가 풀리면 걸어서 경찰서로 돌아간다

    return w?goTo(e,w.x,w.z,0.3,0.8):goTo(e,DOOR.x,DOOR.z,0.5,0.8);

  return think(e,player,dt);
}

  carTick(dt);
  // 쓰러진 마을 토끼 자리는 조금 뒤에 새 토끼가 채운다
  for(let i=vQueue.length-1;i>=0;i--){vQueue[i]-=dt;if(vQueue[i]<=0){vQueue.splice(i,1);addVillager();}}

  // 당근 줍기
  pickups.forEach(k=>{
    if(k.off>0){k.off-=dt;if(k.off<=0)k.g.visible=true;return;}
    k.g.rotation.y+=dt*1.5;k.g.position.y=0.3+Math.sin(time*3+k.x)*0.08;
    if(player.dead<=0&&player.hp<player.hpMax&&Math.hypot(P.x-k.x,P.z-k.z)<0.9&&player.jy<1){
      player.hp=Math.min(player.hpMax,player.hp+35);k.off=45;k.g.visible=false;pop('냠! 체력 회복',player);sfx('heal');
    }
  });
}
say('해설','오사카 도톤보리, 에비스바시 다리 위. 커다란 광고판 아래로 토끼들이 한가롭게 거닐고 있어요.');
say('도움말','발사 버튼을 누르고 있으면 당근 기관총이 나가요. 오토바이를 탄 채로도 쏠 수 있어요.');
say('도움말','전기톱 버튼을 한 번 누르면 켜지고, 다시 누르면 꺼져요. 켜 둔 채로 구르거나 돌진해도 톱을 들고 있어요.');
say('도움말','운하는 다리 세 곳으로만 건널 수 있어요. 당근 오토바이는 다리 남쪽 길목에 세워 뒀어요.');
say('도움말','움직이는 동안에는 시야가 알아서 따라와요. 빈 화면을 끌면 직접 돌릴 수도 있어요.');
say('도움말','소란을 피우면 수배 별이 오르고, 도톤보리 거리 동쪽 토끼 경찰서에서 당근 경찰차가 출동해요. 한동안 조용히 지내면 별이 내려가요.');

const v3=new T.Vector3(),camT=new T.Vector3(),rideBtn=$('ride');let camY=0,camInit=false;
function toScreen(b,h){
  v3.set(b.root.position.x,b.root.position.y+h*b.sc,b.root.position.z).project(cam);
  return {x:(v3.x+1)/2*canvas.clientWidth,y:(1-v3.y)/2*canvas.clientHeight,ok:v3.z<1};
}
function update(dt){
  time+=dt;musicTick();
  let mx=ix,mz=iy;
  if(keys.a||keys.arrowleft)mx-=1; if(keys.d||keys.arrowright)mx+=1;
  if(keys.w||keys.arrowup)mz-=1; if(keys.s||keys.arrowdown)mz+=1;
  if(keys.q){camYaw+=1.9*dt;lookT=1.5;} if(keys.e){camYaw-=1.9*dt;lookT=1.5;}
  // 자동 시야: 움직이는 동안 카메라가 토끼 등 뒤로 천천히 돌아온다. 직접 시야를 돌린 직후와 카메라 쪽으로 걸어올 때는 쉰다
  if(lookT>0)lookT-=dt;
  if(lookId===null&&lookT<=0&&player.dead<=0&&player.roll<0){
    const sp=Math.hypot(player.vx,player.vz);
    if(sp>1){
      let d=player.face+Math.PI-camYaw;d=Math.atan2(Math.sin(d),Math.cos(d));
      camYaw+=d*Math.cos(d/2)*(player.ride?2.6:1.7)*Math.min(1,sp/4)*dt;
    }
  }
  // 스틱의 위쪽은 언제나 카메라가 보는 방향
  const cy=Math.cos(camYaw),sy=Math.sin(camYaw),sx0=mx;
  mx=cy*sx0+sy*mz;mz=-sy*sx0+cy*mz;
  updateBunny(player,{mx,mz,hit:wantHit,jump:wantJump,roll:wantRoll,dash:wantDash},dt);
  wantHit=wantJump=wantRoll=wantDash=false;
  const P=player.root.position;
  // 멀리 있는 병사는 쉬게 둔다
  enemies.forEach(e=>{
    const dP=Math.hypot(e.root.position.x-P.x,e.root.position.z-P.z), on=dP<34;
    e.root.visible=e.shadow.visible=on;
    // 가까우면 전부, 중간이면 그림자 생략, 멀면 외곽선도 생략
    const lod=dP<(10-detail*2.5)?0:dP<(18-detail*4)?1:2;
    if(lod!==e.lod){e.lod=lod;e.casters.forEach(m=>{m.castShadow=lod===0;});e.lines.forEach(m=>{m.visible=lod<2;});}
    if(on)updateBunny(e,e.team==='g'?guardCtrl(e,dt):villagerCtrl(e,dt),dt);
    else{e.fan.visible=false;if(e.team==='g'){e.gone=true;e.silent=true;}}   // 따돌린 경찰 토끼는 포기한다
  });
  // 오토바이로 들이받기
  if(player.ride&&bike.sp>5){
    const fx=Math.sin(bike.face),fz=Math.cos(bike.face);
    enemies.forEach(e=>{
      if(e.ramT>0){e.ramT-=dt;return;}
      if(e.dead>0||!e.root.visible||Math.abs(e.jy-player.jy)>1)return;
      if(Math.hypot(e.root.position.x-P.x,e.root.position.z-P.z)>1.4)return;
      e.ramT=0.8;
      if(e.roll>=0){pop('회피!',e);return;}
      hurt(e,player,{dx:fx,dz:fz},12);e.kx=fx*10;e.kz=fz*10;bike.sp*=0.7;bike.gore=1.2;
    });
  }
  const nearBike=Math.hypot(P.x-bike.g.position.x,P.z-bike.g.position.z)<2.6;
  rideBtn.hidden=!(player.ride||(nearBike&&player.dead<=0));
  if(!rideBtn.hidden)rideBtn.textContent=player.ride?'내리기':'타기';
  // 쓰러진 토끼는 사라진다
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i]; if(!e.gone)continue;
    enemies.splice(i,1);bunnies.splice(bunnies.indexOf(e),1);
    scene.remove(e.root);scene.remove(e.shadow);scene.remove(e.fan);e.box.remove();
    if(!e.silent&&e.team==='v')vQueue.push(10);
  }

  // 서로 겹치지 않게 밀어낸다 (구르는 중에는 통과)
  for(let i=0;i<bunnies.length;i++)for(let j=i+1;j<bunnies.length;j++){
    const A=bunnies[i],B=bunnies[j];
    if(A.dead>0||B.dead>0||A.roll>=0||B.roll>=0||!A.root.visible||!B.root.visible)continue;
    const a=A.root.position,b=B.root.position,dx=b.x-a.x,dz=b.z-a.z;
    if(dx>1||dx<-1||dz>1||dz<-1)continue;
    const d=Math.hypot(dx,dz);
    if(d<0.95&&d>0.001){const p=(0.95-d)/2;a.x-=dx/d*p;a.z-=dz/d*p;b.x+=dx/d*p;b.z+=dz/d*p;}
  }

  turnips.forEach(t=>{
    step(t.s,0,60,3,dt);
    t.g.position.x+=t.vx*dt;t.g.position.z+=t.vz*dt; const f=Math.exp(-4*dt);t.vx*=f;t.vz*=f;
    pushOut(t.g.position,0,0.45);
    const a=Math.max(-1,Math.min(1,t.s.x));
    t.tip.quaternion.setFromAxisAngle(t.axis,a); t.tip.scale.y=1-Math.abs(a)*0.15;
  });

  world(dt);bloodTick(dt);gibTick(dt);

  // 3인칭 카메라: 토끼가 늘 화면 가운데
  const cp=Math.cos(camPitch),D=player.ride?9:7.2;
  camY+=(P.y-camY)*(1-Math.exp(-5*dt));
  camT.set(P.x+Math.sin(camYaw)*cp*D,camY+1.1+Math.sin(camPitch)*D,P.z+Math.cos(camYaw)*cp*D);
  if(camInit)cam.position.lerp(camT,1-Math.exp(-16*dt));else{cam.position.copy(camT);camInit=true;}
  cam.lookAt(P.x,camY+1.1,P.z);
  cam.updateMatrixWorld();

  // 게이지
  hpEl.style.transform='scaleX('+player.hp/player.hpMax+')';
  staEl.style.transform='scaleX('+player.sta/100+')';
  staTrack.classList.toggle('no',player.noSta>0);
  enemies.forEach(e=>{
    if(!e.root.visible||e.dead>0||(e.team==='v'&&e.hp>=e.hpMax)){e.box.hidden=true;return;}
    const s=toScreen(e,2.0);
    e.box.hidden=!s.ok;
    e.box.style.transform='translate('+(s.x-32)+'px,'+s.y+'px)';
    e.fill.style.transform='scaleX('+e.hp/e.hpMax+')';
  });
  if(popT>0&&popB){
    popT-=dt;const q=toScreen(popB,2.5);
    popEl.hidden=false;popEl.style.transform='translate('+q.x+'px,'+(q.y-(0.7-popT)*40)+'px) translate(-50%,-100%)';
    popEl.style.opacity=Math.min(1,popT*3);
  }else popEl.hidden=true;
}

function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==Math.floor(w*renderer.getPixelRatio())||canvas.height!==Math.floor(h*renderer.getPixelRatio())){
    renderer.setSize(w,h,false);cam.aspect=w/Math.max(1,h);cam.fov=w<h?56:45;cam.updateProjectionMatrix();
  }
}
shade(scene);
let last=performance.now(),warm=0,accT=0,accN=0,detail=0,shFrame=0;
if(COARSE&&lit){renderer.shadowMap.autoUpdate=false;}   // 폰에서는 그림자를 두 프레임에 한 번만 다시 그린다
function frame(now){
  const raw=(now-last)/1000,dt=Math.min(1/30,raw);last=now;
  resize();update(dt);
  // 해는 토끼를 따라다니며 그림자를 드리운다
  const SP=player.root.position;
  sun.position.set(SP.x+6,24,SP.z+8);sun.target.position.set(SP.x,0,SP.z);
  // 기기가 버거워하면 그림자를 끈다
  if(COARSE&&lit&&(shFrame++&1)===0)renderer.shadowMap.needsUpdate=true;
  warm+=raw;
  if(warm>3&&raw<0.5){
    accT+=raw;accN++;
    if(accT>=1.5){
      const fps=accN/accT;accT=0;accN=0;
      if(fps<40){
        if(PR>1.25){PR=1.25;renderer.setPixelRatio(PR);}
        else if(PR>1){PR=1;renderer.setPixelRatio(PR);}
        else if(lit&&sun.castShadow){sun.castShadow=false;toast('그림자를 껐어요 (기기 성능)');}
        else if(detail<2)detail++;
      }
    }
  }
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
